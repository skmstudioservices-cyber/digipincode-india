name: Nexus CMS Deploy (bridge)

# Centralised deploy for my-CMS-dashboard: one build -> Worker + Pages.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag to build and deploy
        default: main
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout my-CMS-dashboard
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/my-CMS-dashboard
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (blockmap + astro)
        run: npm run build

      - name: Show build output
        run: ls -la dist && (ls -la dist/_worker.js || echo "no dist/_worker.js dir")

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=my-cms-dashboard --branch=main --commit-dirty=true || echo "pages deploy skipped/failed"

      - name: Verify live
        run: |
          sleep 25
          echo "worker -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my-cms-dashboard.india-in.workers.dev/)"
          echo "pages  -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my-cms-dashboard.pages.dev/)"
