name: Nexus CMS Deploy (bridge)

# Deploys the my-CMS-dashboard worker using THIS repo's Cloudflare secrets
# (same bridge pattern as examstatus-deploy.yml / dashboard-deploy.yml).
#
# LOGIN IS DISABLED FOR NOW — the worker runs in DEMO MODE (public sandbox).
# The NEXUS_TOKEN step below is commented out on purpose. Re-enable it (and
# add a NEXUS_TOKEN repo-secret) only when the dashboard is finished.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout my-CMS-dashboard
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/my-CMS-dashboard
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply schema to cms-db (additive, CREATE TABLE IF NOT EXISTS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 execute cms-db --remote --file=schema.sql

      # ───────────────────────── LOGIN: DISABLED ─────────────────────────
      # Turn this back on (uncomment) when the dashboard is finished, to enable
      # the NEXUS_TOKEN login + the 30-day session cookie. Until then the worker
      # serves Demo Mode and no write operations are locked.
      #
      # - name: Set NEXUS_TOKEN (login)
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
      #   run: printf '%s' "$NEXUS_TOKEN" | npx --yes wrangler@latest secret put NEXUS_TOKEN

      - name: Deploy worker (demo mode)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify live
        run: |
          sleep 25
          echo "my-cms-dashboard -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my-cms-dashboard.india-in.workers.dev/)"
