name: Nexus CMS Deploy (bridge)

# Builds the Astro + Tailwind + daisyUI dashboard and deploys the Worker,
# using THIS repo's Cloudflare secrets (bridge pattern).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout my-CMS-dashboard
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/my-CMS-dashboard
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (blockmap + astro)
        run: npm run build

      - name: Show build output
        run: ls -la dist && (ls -la dist/_worker.js || echo "no dist/_worker.js dir")

      - name: Apply schema to cms-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 execute cms-db --remote --file=schema.sql

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify live
        run: |
          sleep 25
          echo "home -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my-cms-dashboard.india-in.workers.dev/)"
