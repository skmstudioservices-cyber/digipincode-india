name: Refresh Cloudflare snapshot

# This workflow refreshes dashboard data only.
# The website itself is deployed by the GitHub-connected Cloudflare Pages integration.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: CMS branch or tag to report
        default: main
        required: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Publish Cloudflare resource snapshot to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          api_get() {
            curl --fail --silent --show-error -H "$H" "$1"
          }

          PAGES=$(api_get "$BASE/pages/projects" | jq -ce 'if .success then [.result[]? | {name, productionBranch, domain: (.domains[0] // .subdomain)}] else error("Cloudflare Pages API failed") end')
          WORKERS=$(api_get "$BASE/workers/scripts" | jq -ce 'if .success then [.result[]? | {id, modified: .modified_on}] else error("Cloudflare Workers API failed") end')
          D1=$(api_get "$BASE/d1/database" | jq -ce 'if .success then [.result[]? | {name, uuid, sizeKb: ((.file_size // 0)/1024|floor)}] else error("Cloudflare D1 API failed") end')
          KV=$(api_get "$BASE/storage/kv/namespaces" | jq -ce 'if .success then [.result[]? | {title, id}] else error("Cloudflare KV API failed") end')

          ENCODED_REF=$(jq -rn --arg value "$CMS_REF" '$value|@uri')
          CMS_META=$(curl --fail --silent --show-error             "https://api.github.com/repos/skmstudioservices-cyber/my-CMS-dashboard/commits/$ENCODED_REF")
          CMS_COMMIT=$(jq -er '.sha' <<< "$CMS_META")
          CMS_MESSAGE=$(jq -er '.commit.message | split("\n")[0]' <<< "$CMS_META")
          CMS_COMMITTED_AT=$(jq -er '.commit.committer.date' <<< "$CMS_META")
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          jq -n             --arg acct "$CLOUDFLARE_ACCOUNT_ID"             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg repo "skmstudioservices-cyber/my-CMS-dashboard"             --arg branch "$CMS_REF"             --arg commit "$CMS_COMMIT"             --arg message "$CMS_MESSAGE"             --arg committedAt "$CMS_COMMITTED_AT"             --arg runUrl "$RUN_URL"             --argjson pages "$PAGES"             --argjson workers "$WORKERS"             --argjson d1 "$D1"             --argjson kv "$KV"             '{accountId:$acct, generatedAt:$ts, source:{repository:$repo, branch:$branch, commit:$commit, message:$message, committedAt:$committedAt, runUrl:$runUrl}, pages:$pages, workers:$workers, d1:$d1, kv:$kv}'             > /tmp/cf-snapshot.json

          NS="e0d8b85873724d2a9779f84b91676e41"
          STATUS=$(curl --silent --show-error --output /tmp/kv-response.json --write-out '%{http_code}'             --request PUT             -H "$H"             -H "Content-Type: application/json"             --data-binary @/tmp/cf-snapshot.json             "$BASE/storage/kv/namespaces/$NS/values/cf%3Asnapshot")
          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            cat /tmp/kv-response.json
            echo "KV snapshot write failed with HTTP $STATUS" >&2
            exit 1
          fi
          echo "Snapshot refreshed for CMS ref $CMS_REF at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
