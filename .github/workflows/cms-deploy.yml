name: Nexus CMS Deploy (bridge)

# Centralised deploy for my-CMS-dashboard: one build -> Worker + Pages,
# then publishes a Cloudflare resource snapshot to KV for the Cloudflare panel.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag to build and deploy
        default: main
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout my-CMS-dashboard
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/my-CMS-dashboard
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (blockmap + astro)
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=my-cms-dashboard --branch=main --commit-dirty=true || echo "pages deploy skipped"

      - name: Publish Cloudflare snapshot to KV
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          H="Authorization: Bearer $CF"
          ACCT=$(curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          PAGES=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects" | jq -c '[.result[]? | {name, productionBranch, domain: (.domains[0] // .subdomain)}]')
          WORKERS=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts" | jq -c '[.result[]? | {id, modified: .modified_on}]')
          D1=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACCT/d1/database" | jq -c '[.result[]? | {name, uuid, sizeKb: ((.file_size // 0)/1024|floor)}]')
          KV=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACCT/storage/kv/namespaces" | jq -c '[.result[]? | {title, id}]')
          jq -n --arg acct "$ACCT" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson pages "$PAGES" --argjson workers "$WORKERS" --argjson d1 "$D1" --argjson kv "$KV" \
            '{accountId:$acct, generatedAt:$ts, pages:$pages, workers:$workers, d1:$d1, kv:$kv}' > /tmp/cf-snapshot.json
          npx --yes wrangler@latest kv key put cf:snapshot --path=/tmp/cf-snapshot.json --namespace-id=e0d8b85873724d2a9779f84b91676e41 --remote

      - name: Verify live
        run: |
          sleep 20
          echo "worker -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://my-cms-dashboard.india-in.workers.dev/)"
          echo "api/cf -> $(curl -s --max-time 30 https://my-cms-dashboard.india-in.workers.dev/api/cf | head -c 160)"
