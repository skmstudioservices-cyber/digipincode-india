name: Build key pages list (300)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query D1 (states + top districts by village count)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT s.slug AS s_slug, d.slug AS d_slug, COUNT(v.id) AS vc FROM districts d JOIN states s ON s.id=d.state_id LEFT JOIN sub_districts sd ON sd.district_id=d.id LEFT JOIN villages v ON v.sub_district_id=sd.id GROUP BY d.id ORDER BY vc DESC LIMIT 300;" > districts.json
      - name: Build URL list
        run: node scripts/build-key-pages.mjs
      - name: Commit
        run: |
          git config user.name "skm-bot"
          git config user.email "skmstudio.services@gmail.com"
          git add key-pages-300.txt
          git diff --staged --quiet || git commit -m "chore: refresh key-pages-300 list"
          git push
