name: Full Retest (per-item)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Per-item live probe
        run: |
          set +e
          probe() {
            name="$1"; base="$2"
            echo "===== $name : $base ====="
            h=$(curl -s -m 25 -o /tmp/h -w '%{http_code}' "$base/"); b=$(wc -c </tmp/h)
            echo "home http=$h bytes=$b"
            echo "  title: $(sed -n 's/.*<title>\([^<]*\)<\/title>.*/\1/p' /tmp/h | head -1 | cut -c1-70)"
            echo "  canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/h | head -1)"
            echo "  gsc=$(grep -c 'google-site-verification' /tmp/h) ga=$(grep -c 'googletagmanager' /tmp/h) monetag=$(grep -ci 'monetag\|quge5\|5gvci' /tmp/h)"
            sm=$(curl -s -m 25 -o /tmp/sm -w '%{http_code}' "$base/sitemap.xml")
            echo "  sitemap.xml http=$sm urls=$(grep -c '<loc>' /tmp/sm) doubleslash=$(grep -c '://[^/]*//' /tmp/sm)"
            echo "  sitemap/pages.xml http=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$base/sitemap/pages.xml")"
          }
          probe "digipincode-WORKERS" "https://digipincode.india-in.workers.dev"
          probe "digipincode-PAGES"   "https://digipincode.pages.dev"
          probe "EV"                  "https://evchargersnearme.pages.dev"
          probe "TOILETS"             "https://toiletsnearme.pages.dev"
          probe "EXAMSTATUS"          "https://examstatus.india-in.workers.dev"
      - name: Source triage
        run: |
          set +e
          echo "=== sitemap index source ==="; sed -n '1,40p' src/pages/sitemap.xml.ts
          echo "=== sitemap chunk source ==="; sed -n '1,40p' 'src/pages/sitemap/[part].xml.ts'
          echo "=== pages sitemap source ==="; sed -n '1,30p' src/pages/sitemap/pages.xml.ts
