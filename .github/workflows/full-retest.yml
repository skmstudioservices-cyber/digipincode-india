name: Full Retest (per-item)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source triage
        run: |
          set +e
          echo "=== files referencing india-IN-state ==="
          grep -rln "india-IN-state" src | head -20
          echo "=== builders ==="
          for f in $(grep -rln "india-IN-state" src); do echo "----- $f -----"; sed -n '1,80p' "$f"; done
          echo "=== sitemap-flat source ==="
          sed -n '1,120p' src/pages/sitemap-flat.xml.ts
          echo "=== Base.astro (canonical + GA) ==="
          sed -n '1,100p' src/layouts/Base.astro
