name: Full Retest (per-item)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Source triage — root cause of double-slash + canonical + GA
        run: |
          set +e
          echo "=== files referencing india-IN-state ==="
          grep -rln "india-IN-state" src | head -20
          echo "=== flat url builder(s) ==="
          for f in $(grep -rln "india-IN-state" src); do echo "----- $f -----"; sed -n '1,90p' "$f"; done
          echo "=== sitemap-flat source ==="
          sed -n '1,140p' src/pages/sitemap-flat.xml.ts
          echo "=== Base.astro head (canonical + GA) ==="
          sed -n '1,110p' src/layouts/Base.astro
          echo "=== grep double-slash patterns ==="
          grep -rn '//' src/lib 2>/dev/null | grep -iE 'slug|url|path' | head -30
