name: CF Traffic
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Traffic breakdown
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          H="Authorization: Bearer $CF"
          ACCT=$(curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          run() {
            local dim="$1" lim="$2"
            local q="{ viewer { accounts(filter:{accountTag:\"$ACCT\"}) { httpRequestsAdaptiveGroups(limit:$lim, filter:{datetime_geq:\"2026-10-02T00:00:00Z\"}) { count dimensions { $dim } } } } }"
            local body; body=$(jq -n --arg q "$q" '{query:$q}')
            echo "=== $dim ==="
            curl -s -H "$H" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql --data "$body" \
              | jq -r ".data.viewer.accounts[0].httpRequestsAdaptiveGroups[]? | \"\(.count)  \(.dimensions.$dim)\"" | sort -rn | head -20
          }
          run clientRequestHTTPHost 25
          run edgeResponseStatus 10
          run clientCountryName 12
          run userAgent 25
          run clientRequestPath 25
