name: CF Traffic
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Traffic breakdown
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          H="Authorization: Bearer $CF"
          ACCT=$(curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          Q() { curl -s -H "$H" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql --data "$1"; }
          FILT='datetime_geq:"2026-10-02T00:00:00Z"'
          run() { echo "=== $1 ==="; Q "{\"query\":\"{ viewer { accounts(filter:{accountTag:\\\"$ACCT\\\"}) { httpRequestsAdaptiveGroups(limit:$2, filter:{$FILT}) { count dimensions { $1 } } } } }\"}" | jq -r ".data.viewer.accounts[0].httpRequestsAdaptiveGroups[]? | \"\(.count)  \(.dimensions.$1)\"" | sort -rn; }
          run clientRequestHTTPHost 20
          run edgeResponseStatus 10
          run clientCountryName 12
          run userAgent 20
          run clientRequestPath 20
          echo "=== ERRORS ==="
          Q "{\"query\":\"{ viewer { accounts(filter:{accountTag:\\\"$ACCT\\\"}) { httpRequestsAdaptiveGroups(limit:3, filter:{$FILT}) { count dimensions { clientCountryName } } } } }\"}" | jq -c '.errors'
