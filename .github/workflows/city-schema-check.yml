name: City Schema Check + Auto-Fix (weekly)

# Weekly recheck + AUTO-FIX (user rule 406, 24 Oct 2026).
# 1. Finds every city page missing JSON-LD across the network.
# 2. AUTO-COMMITS BreadcrumbList + FAQPage + Place schema to those pages.
# 3. Flags robots.txt blocking AI SEARCH bots.
#
# Needs a repo secret: GH_PAT (fine-grained token, Contents:write on site repos).
# Without it the job only REPORTS (no writes).

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only (true) or auto-fix (false)'
        required: false
        default: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check + auto-fix city schema
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DRY: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, base64, urllib.request, urllib.error
          PAT=os.environ.get("GH_PAT") or ""
          DRY=(os.environ.get("DRY") or "false").lower()=="true"
          ORG="skmstudioservices-cyber"
          d=json.load(open("sites.json"))
          sites=[p.rstrip("/") for p in d.get("pages",[])]
          CITY=re.compile(r"/(delhi|mumbai|bengaluru|hyderabad|chennai|kolkata|pune|ahmedabad|jaipur|lucknow|surat|indore|chandigarh|bhopal|nagpur)/?$")
          def get(u,hdr=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=hdr or {"User-Agent":"Mozilla/5.0 skm-check"}),timeout=20)
                  return r.getcode(), r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e: return e.code,""
              except Exception: return 0,""
          def api(path, method="GET", body=None):
              hdr={"User-Agent":"skm-bot","Authorization":"Bearer "+PAT,"Accept":"application/vnd.github+json"}
              data=json.dumps(body).encode() if body else None
              if data: hdr["Content-Type"]="application/json"
              r=urllib.request.urlopen(urllib.request.Request("https://api.github.com"+path,data=data,headers=hdr,method=method),timeout=30)
              return json.load(r)
          fixed=0; flagged=0
          for s in sites:
              host=s.replace("https://","").split(".")[0]
              c,b=get(s+"/sitemap.xml")
              urls=re.findall(r"<loc>([^<]+)</loc>", b) if c==200 else []
              city_urls=[u for u in urls if CITY.search(u)]
              if not city_urls: continue
              for u in city_urls:
                  code,html=get(u)
                  if code!=200 or "application/ld+json" in html: continue
                  flagged+=1
                  if DRY or not PAT:
                      print(f"NEEDS FIX: {u}"); continue
                  city=CITY.search(u).group(1).title()
                  blk='<script type="application/ld+json">%s</script>'
                  schema=blk%json.dumps({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":s+"/"},{"@type":"ListItem","position":2,"name":"Public places in "+city,"item":u}]})
                  schema+="\n"+blk%json.dumps({"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Where can I find this near "+city+"?","acceptedAnswer":{"@type":"Answer","text":"Use the live map on this page to find places across "+city+" with directions."}},{"@type":"Question","name":"Is this free to use?","acceptedAnswer":{"@type":"Answer","text":"Yes, free and no signup. Data from OpenStreetMap."}}]})
                  path=u.replace(s+"/","").strip("/")+"/index.html"
                  try:
                      cur=api(f"/repos/{ORG}/{host}/contents/{path}")
                      new=base64.b64encode((html.replace("</head>",schema+"\n</head>",1)).encode()).decode()
                      api(f"/repos/{ORG}/{host}/contents/{path}","PUT",{"message":"fix(seo): auto-add JSON-LD to city page","content":new,"sha":cur["sha"]})
                      fixed+=1; print(f"FIXED: {u}")
                  except Exception as e: print(f"fix failed {u}: {str(e)[:60]}")
          print(f"\n===== CITY SCHEMA =====")
          print(f"needs fix: {flagged} | auto-fixed: {fixed} | dry_run: {DRY} | token: {'yes' if PAT else 'NO'}")
          PY
