name: Pages Inspect mapsnearme

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe mapsnearme pages + deployment aliases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          probe() {
            label="$1"; url="$2"
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "$url")
            size=$(wc -c < /tmp/b)
            echo "=== $label: $url -> HTTP $code (${size}b)"
            head -c 300 /tmp/b | tr '\n' ' '
            echo; echo
          }
          probe "prod-home" "https://mapsnearme.pages.dev/"
          probe "prod-search" "https://mapsnearme.pages.dev/search?q=Dentist&loc=Delhi"
          probe "prod-sitemap" "https://mapsnearme.pages.dev/sitemap.xml"
          probe "alias-1144" "https://ae45b917.mapsnearme.pages.dev/"
          probe "alias-1341" "https://6a93ec08.mapsnearme.pages.dev/"
          probe "dashboard-prod" "https://dashboardmapsnearme.pages.dev/dashboard"
          echo "=== deployment list (mapsnearme) ==="
          npx --yes wrangler pages deployment list --project-name=mapsnearme
          echo "=== project list ==="
          npx --yes wrangler pages project list
