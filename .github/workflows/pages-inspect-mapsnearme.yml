name: Pages Inspect mapsnearme

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe mapsnearme pages + deployment aliases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          probe() {
            label="$1"; url="$2"
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "$url")
            size=$(wc -c < /tmp/b)
            echo "=== $label: $url -> HTTP $code (${size}b)"
            head -c 300 /tmp/b | tr '\n' ' '
            echo; echo
          }
          probe "prod-home" "https://mapsnearme.pages.dev/"
          probe "prod-favicon" "https://mapsnearme.pages.dev/favicon.ico"
          probe "prod-astro-css" "https://mapsnearme.pages.dev/_astro/about.lMfcpRL2.css"
          probe "dashboard-prod" "https://dashboardmapsnearme.pages.dev/dashboard"
          probe "digipincode-pages" "https://digipincode.pages.dev/"
          probe "static-control" "https://skm-voice-agent.pages.dev/"
