name: Fix digipincode & capture design

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl checks + live screenshot via CF Browser Rendering
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          mkdir -p shots
          echo "=== RAW HTTP CHECKS ==="
          for u in "https://mapsnearme.pages.dev/" "https://mapsnearme.pages.dev/city/delhi" "https://digipincode.india-in.workers.dev/" "https://digipincode.india-in.workers.dev/search?q=110001"; do
            echo "--- $u"
            curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" -L "$u" || true
          done
          echo "=== digipincode homepage title ==="
          curl -sS -L "https://digipincode.india-in.workers.dev/" | grep -oE "<title>[^<]*</title>" || echo "no title"
          echo "=== mapsnearme content snippet ==="
          curl -sS -L "https://mapsnearme.pages.dev/" | grep -oE "Verified Businesses|Businesses Near You|Search Now|160\+|150\+" | sort -u || true
          shot() {
            url="$1"; out="$2"; w="$3"; h="$4"
            for attempt in 1 2 3; do
              code=$(curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/browser-rendering/screenshot" \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"url\": \"$url\", \"viewport\": {\"width\": $w, \"height\": $h, \"deviceScaleFactor\": 1}, \"gotoOptions\": {\"waitUntil\": \"networkidle0\", \"timeout\": 60000}, \"screenshotOptions\": {\"fullPage\": true, \"type\": \"jpeg\"}}" \
                -o "shots/$out" -w "%{http_code}")
              echo "attempt $attempt: HTTP $code for $url -> shots/$out"
              if [ "$code" = "200" ] && file "shots/$out" | grep -q JPEG; then
                return 0
              fi
              echo "waiting 65s before retry (rate limit)..."
              sleep 65
            done
            echo "FAILED to capture $out after 3 attempts"
          }
          shot "https://mapsnearme.pages.dev/" "live-final-desktop.jpg" 1440 900
          sleep 65
          shot "https://digipincode.india-in.workers.dev/" "digipincode-desktop.jpg" 1440 900
          ls -la shots/
      - name: Commit captures to design-captures branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B design-captures
          mkdir -p design
          cp -v shots/*.jpg design/ 2>/dev/null || echo "no screenshots captured"
          git add design || true
          git commit -m "chore: final Phase 0/1 verification captures" || echo "nothing to commit"
          git push origin design-captures --force
