name: Fix digipincode & capture design

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-session-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure SESSION KV namespace exists + print IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          npx wrangler@latest kv namespace create SESSION || echo "(may already exist)"
          echo "=== VIA REST API (JSON) ==="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq . || true

  inspect-astro-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build digipincode + dump output structure
        run: |
          npm install --no-audit --no-fund
          npm run build
          echo "=== DIST TREE (depth 3) ==="
          find dist -maxdepth 3 | sort | head -80
          echo "=== GENERATED WRANGLER CONFIG ==="
          find dist -name 'wrangler.json' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

  capture-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot design refs + live mapsnearme via CF Browser Rendering
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          mkdir -p shots
          shot() {
            url="$1"; out="$2"; w="$3"; h="$4"
            for attempt in 1 2 3; do
              code=$(curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/browser-rendering/screenshot" \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"url\": \"$url\", \"viewport\": {\"width\": $w, \"height\": $h, \"deviceScaleFactor\": 1}, \"gotoOptions\": {\"waitUntil\": \"networkidle0\", \"timeout\": 60000}, \"screenshotOptions\": {\"fullPage\": true, \"type\": \"jpeg\"}}" \
                -o "shots/$out" -w "%{http_code}")
              echo "attempt $attempt: HTTP $code for $url -> shots/$out"
              if [ "$code" = "200" ] && file "shots/$out" | grep -q JPEG; then
                return 0
              fi
              echo "waiting 65s before retry (rate limit)..."
              sleep 65
            done
            echo "FAILED to capture $out after 3 attempts"
          }
          shot "https://mapsnearme.pages.dev/" "live-mapsnearme-desktop.jpg" 1440 900
          sleep 65
          shot "https://mapsnearme.pages.dev/" "live-mapsnearme-mobile.jpg" 390 844
          ls -la shots/
      - name: Commit captures to design-captures branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B design-captures
          mkdir -p design
          cp -v shots/*.jpg design/ 2>/dev/null || echo "no screenshots captured"
          git add design || true
          git commit -m "chore: live mapsnearme captures" || echo "nothing to commit"
          git push origin design-captures --force
