name: Nexus CMS Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe shell + PWA + noindex
        run: |
          B=https://my-cms-dashboard.india-in.workers.dev
          html=$(curl -s -m 30 "$B/?cb=$RANDOM")
          echo "title=$(printf '%s' "$html" | grep -o '<title>[^<]*')"
          echo "noindex=$(printf '%s' "$html" | grep -c 'noindex')"
          echo "manifest_link=$(printf '%s' "$html" | grep -c 'manifest.webmanifest')"
          echo "theme_color=$(printf '%s' "$html" | grep -c 'theme-color')"
          echo "--- PWA files ---"
          for p in /manifest.webmanifest /sw.js /robots.txt /icon.svg /vault.html /blockmap.json; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' -m 20 $B$p)"
          done
          echo "robots.txt body: $(curl -s -m 20 $B/robots.txt)"
          echo "--- APIs ---"
          for e in /api/overview /api/sites /api/comments /api/recommendations /api/crons; do
            echo "$e -> $(curl -s -o /dev/null -w '%{http_code}' -m 20 $B$e)"
          done
