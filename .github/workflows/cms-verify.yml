name: Nexus CMS Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Raw HTML probe
        run: |
          html=$(curl -s -m 30 "https://my-cms-dashboard.india-in.workers.dev/?cb=$RANDOM")
          echo "bytes=$(printf '%s' "$html" | wc -c)"
          echo "title=$(printf '%s' "$html" | grep -o '<title>[^<]*' | head -1)"
          echo "has_view=$(printf '%s' "$html" | grep -c 'id="view"')"
          echo "has_skmdark=$(printf '%s' "$html" | grep -c 'skmdark')"
          echo "has_datablock=$(printf '%s' "$html" | grep -c 'data-block')"
          echo "has_daisyui=$(printf '%s' "$html" | grep -c 'daisy')"
          echo "--- first 300 chars ---"
          printf '%s' "$html" | head -c 300
