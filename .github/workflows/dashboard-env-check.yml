name: Dashboard Env Check

# Verifies that the dashboardmapsnearme Pages project has its runtime env
# vars (SUPABASE_URL / SUPABASE_ANON_KEY) applied from wrangler.jsonc.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages project env vars via CF API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/dashboardmapsnearme" \
            -o /tmp/p.json
          echo "=== success flag ==="
          jq '.success' /tmp/p.json
          echo "=== production env vars ==="
          jq '.result.deployment_configs.production.env_vars // "NONE FOUND"' /tmp/p.json
          echo "=== production bindings (D1) ==="
          jq '.result.deployment_configs.production.d1_databases // "NONE FOUND"' /tmp/p.json
