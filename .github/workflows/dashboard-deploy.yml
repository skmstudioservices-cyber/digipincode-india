name: Dashboard Pages Deploy (bridge)

# Deploys the dashboardmapsnearme repo to CF Pages using THIS repo's Cloudflare
# secrets - same bridge pattern as mapsnearme-deploy.yml. Use until the
# dashboardmapsnearme repo has its own CLOUDFLARE_* secrets.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboardmapsnearme (main)
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/dashboardmapsnearme
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro dashboard
        run: npm run build

      - name: Deploy to Cloudflare Pages (dashboardmapsnearme)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dashboardmapsnearme --branch=main --commit-dirty=true
