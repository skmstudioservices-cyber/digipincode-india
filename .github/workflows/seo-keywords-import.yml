name: SEO Keywords Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute seo-keywords-db --remote --file=./seo/seo-db-schema.sql

      - name: Import keyword data (seed batch, idempotent upsert)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute seo-keywords-db --remote --file=./seo/seo-db-seed3.sql

      - name: Verify counts (per cluster)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute seo-keywords-db --remote --json --command "SELECT cluster, COUNT(*) AS n, MAX(volume) AS max_vol FROM keywords WHERE site='digipincode' GROUP BY cluster ORDER BY n DESC"
