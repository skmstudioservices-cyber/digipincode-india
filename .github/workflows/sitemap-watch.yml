name: Sitemap Watch Audit
on:
  push:
    paths:
      - '.github/workflows/sitemap-watch.yml'
      - 'scripts/sitemap-watch.py'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sitemap-watch.py
