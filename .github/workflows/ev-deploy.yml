name: EV Deploy (bridge)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EVchargersnearme
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/EVchargersnearme
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name=evchargersnearme --branch=main --commit-dirty=true
      - name: Verify
        run: |
          sleep 20
          echo "home -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://evchargersnearme.pages.dev/)"
          echo "stations -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://evchargersnearme.pages.dev/stations/)"
          echo "stations.json -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://evchargersnearme.pages.dev/data/stations.json)"
