name: Astro6 Build Test
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to test
        default: feat/emdash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/digipincode-india
          ref: ${{ github.event.inputs.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Node version
        run: node -v
      - name: Install (strict)
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tail -12
      - name: Build (strict)
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -50
      - name: Output
        run: |
          ls dist | head -15
          ls dist/_worker.js 2>/dev/null | head -3 || echo "no _worker.js"
