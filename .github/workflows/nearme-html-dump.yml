name: Near-Me HTML Dump
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://atmsnearme.pages.dev"
          curl -s -m 30 "$U/?cb=$RANDOM" -o /tmp/p.html
          echo "=== script tags ==="
          grep -o '<script[^>]*>' /tmp/p.html
          echo "=== app.js first 260 ==="
          curl -s -m 30 "$U/js/app.js" | head -c 260
          echo
          echo "=== app.js grep geo line ==="
          curl -s -m 30 "$U/js/app.js" | grep -n "geo\|getCurrentPosition" | head
          echo "=== blocks.js first 120 ==="
          curl -s -m 30 "$U/js/blocks.js" | head -c 120
          echo
