name: Near-Me HTML Dump
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          U="https://atmsnearme.pages.dev"
          for f in app blocks content analytics; do
            curl -s -m 30 "$U/js/$f.js" -o /tmp/$f.js
            echo "== $f.js size=$(wc -c </tmp/$f.js)"
            node --check /tmp/$f.js && echo "   $f OK" || echo "   $f FAIL"
          done
          echo "=== inline CAT script ==="
          curl -s -m 30 "$U/?cb=$RANDOM" | grep -o '<script>window.CAT[^<]*</script>'
