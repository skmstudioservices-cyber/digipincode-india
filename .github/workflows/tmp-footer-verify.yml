name: Tmp Footer Verify (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Grep live pages for freshness + network footer
        run: |
          for u in "" "kerala" "states" "pincode/110001"; do
            url="https://digipincode.india-in.workers.dev/$u?cb=$RANDOM"
            code=$(curl -s -o /tmp/f.html -w "%{http_code}" --max-time 30 "$url")
            echo "=== /$u -> $code"
            echo "  net-more block : $(grep -c 'net-more' /tmp/f.html || true)"
            echo "  More near me   : $(grep -c 'More near me' /tmp/f.html || true)"
            echo "  mapsnearme lnk : $(grep -c 'mapsnearme.pages.dev' /tmp/f.html || true)"
            echo "  demo-vmv lnk   : $(grep -c 'demo-vmv.pages.dev' /tmp/f.html || true)"
            echo "  Page last upd  : $(grep -c 'Page last updated' /tmp/f.html || true)"
          done
