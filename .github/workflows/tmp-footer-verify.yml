name: Tmp Footer Verify (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe URL variants (status codes)
        run: |
          for u in "" "states" "states/" "search" "search/" "saved" "saved/" "pincode/110001" "pincode/110001/" "pin-code/110001" "pin-code/110001/" "kerala" "kerala/" "state/kerala" "state/kerala/" "chhath/" "about" "about/" "privacy-policy" "privacy-policy/" "sitemap.xml" "robots.txt"; do
            url="https://digipincode.india-in.workers.dev/$u?cb=$RANDOM"
            code=$(curl -s -o /tmp/f.html -w "%{http_code}" --max-time 25 "$url")
            echo "/$u -> $code"
          done
