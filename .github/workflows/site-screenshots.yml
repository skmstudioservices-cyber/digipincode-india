name: Site Screenshots (mobile + desktop gate)

# WHY: 200 OK is not a pass. This renders every site in a real browser at a
# phone width and a desktop width, saves the screenshots as artifacts, and
# fails the job if a page overflows sideways, loses its h1, has a collapsed
# map, or drops the owner-only beacon. Owner rule (27 Nov 2026).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-screenshots.yml'
  schedule:
    - cron: '30 3 * * 1'   # Mondays 09:00 IST

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.m.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          S=$(jq -c '[.[] | select(. != "opticiansnearme" and . != "stationeryshopnearme")]' repo-factory/slugs.json)
          echo "sites=$S" >> "$GITHUB_OUTPUT"

  shots:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        site: ${{ fromJSON(needs.list.outputs.sites) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i -D playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Screenshot + responsive gate
        env:
          SITE: ${{ matrix.site }}
        run: |
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const site = process.env.SITE;
          const url = `https://${site}.pages.dev/`;
          const devices = [
            { name: 'mobile',  width: 390,  height: 844, mobile: true  },
            { name: 'desktop', width: 1366, height: 768, mobile: false },
          ];
          const browser = await chromium.launch();
          const out = [];
          let fail = 0;
          for (const d of devices) {
            const ctx = await browser.newContext({
              viewport: { width: d.width, height: d.height },
              isMobile: d.mobile, hasTouch: d.mobile,
              userAgent: d.mobile
                ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
                : undefined,
            });
            const page = await ctx.newPage();
            let status = 0;
            try {
              const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              status = res ? res.status() : 0;
              await page.waitForTimeout(2500);
            } catch (e) { status = 0; }
            const r = await page.evaluate(() => {
              const q = (s) => document.querySelector(s);
              const map = q('#map');
              const go = q('#go');
              const mb = map ? map.getBoundingClientRect() : null;
              const gb = go ? go.getBoundingClientRect() : null;
              return {
                title: document.title || '',
                h1: document.querySelectorAll('h1').length,
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                mapH: mb ? Math.round(mb.height) : 0,
                goW: gb ? Math.round(gb.width) : 0,
                goH: gb ? Math.round(gb.height) : 0,
                beacon: !!document.querySelector('script[src="/js/analytics.js"]'),
                manifest: !!document.querySelector('link[rel="manifest"]'),
                sw: 'serviceWorker' in navigator,
              };
            });
            const problems = [];
            if (status !== 200) problems.push(`status ${status}`);
            if (!r.title) problems.push('no title');
            if (r.h1 !== 1) problems.push(`h1=${r.h1}`);
            if (r.overflow > 2) problems.push(`overflow ${r.overflow}px`);
            if (r.mapH < 150) problems.push(`map ${r.mapH}px`);
            if (r.goW < 40 || r.goH < 40) problems.push(`tap ${r.goW}x${r.goH}`);
            if (!r.beacon) problems.push('beacon missing');
            if (!r.manifest) problems.push('manifest missing');
            await page.screenshot({ path: `shots/${site}-${d.name}.png`, fullPage: true }).catch(() => {});
            await ctx.close();
            out.push({ d: d.name, ...r, problems });
            if (problems.length) fail++;
          }
          await browser.close();
          for (const o of out) {
            console.log(`| ${site} | ${o.d} | ${o.title.slice(0, 42)} | ${o.mapH}px | ${o.goW}x${o.goH} | ${o.overflow}px | ${o.beacon ? 'yes' : 'NO'} | ${o.problems.length ? 'FAIL: ' + o.problems.join(', ') : 'pass'} |`);
          }
          if (fail) process.exit(1);
          JS
          set -o pipefail
          mkdir -p shots
          node shot.mjs | tee row.txt
          {
            echo "| site | device | title | map | tap | overflow | beacon | result |"
            echo "|---|---|---|---|---|---|---|---|"
            cat row.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.site }}
          path: shots/
          if-no-files-found: warn
          retention-days: 14
