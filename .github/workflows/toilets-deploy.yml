name: Toilets Deploy (bridge)
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: skmstudioservices-cyber/toiletsnearme, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name=toiletsnearme --branch=main --commit-dirty=true
      - name: Verify
        run: |
          sleep 20
          echo "title: $(curl -s -m 30 https://toiletsnearme.pages.dev/ | grep -o '<title>[^<]*')"
          echo "faq: $(curl -s -m 30 https://toiletsnearme.pages.dev/ | grep -c FAQPage)"
