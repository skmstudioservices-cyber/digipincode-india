name: Debug Voice Agent UI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP checks
        run: |
          for u in https://skm-voice-agent.pages.dev https://skm-voice-agent-proxy.india-in.workers.dev; do
            echo "=== $u"
            curl -s -o /dev/null -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$u"
          done
          echo "=== key injected on worker URL? (first 10 chars)"
          curl -s https://skm-voice-agent-proxy.india-in.workers.dev | grep -oE 'window.__VB_PROXY_KEY__ = "[^"]{1,10}' || echo "NOT FOUND / placeholder unreplaced"
          echo "=== /chat without key (expect 401)"
          curl -s -o /dev/null -w "%{http_code}\n" -X POST https://skm-voice-agent-proxy.india-in.workers.dev/chat -H 'Content-Type: application/json' -d '{}'
      - name: Browser check (console errors + screenshots)
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          for (const [name, url] of [['pages', 'https://skm-voice-agent.pages.dev'], ['worker', 'https://skm-voice-agent-proxy.india-in.workers.dev']]) {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const errors = [];
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text().slice(0, 300)); });
            page.on('pageerror', e => errors.push('PAGEERROR: ' + String(e.message).slice(0, 300)));
            await page.goto(url, { waitUntil: 'load', timeout: 30000 }).catch(e => errors.push('GOTO: ' + String(e.message).slice(0, 300)));
            await page.waitForTimeout(2500);
            const info = await page.evaluate(() => ({
              key: String(window.__VB_PROXY_KEY__ || '').slice(0, 8),
              status: document.getElementById('status')?.textContent,
              orbLabel: document.getElementById('orbLabel')?.textContent,
              chatMsgs: document.querySelectorAll('.msg').length,
              notes: document.querySelectorAll('.note').length,
              textLen: document.body.innerText.length,
            })).catch(e => ({ evalFail: String(e).slice(0, 200) }));
            console.log(`[${name}] ${JSON.stringify(info)}`);
            console.log(`[${name}] errors=${JSON.stringify(errors)}`);
            await page.screenshot({ path: `${name}.png` });
            await browser.close();
          }
          EOF
          node check.mjs
          for f in pages.png worker.png; do echo "---BASE64_START_$f"; base64 -w0 "$f"; echo; echo "---BASE64_END_$f"; done
