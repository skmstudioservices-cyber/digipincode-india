name: Pages Source Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CF API - Pages project source config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for proj in mapsnearme dashboardmapsnearme; do
            echo "=== PROJECT $proj source:"
            curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/pages/projects/$proj" | jq -c '.result | {name, source, production_branch}'
            echo
          done
