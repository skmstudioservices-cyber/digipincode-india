name: D1 Add Missing Indexes

on:
  workflow_dispatch:
  # Retry right after the daily D1 quota reset (00:00 UTC) - the CREATE INDEX
  # reads the whole table, so it must run when rows-read budget is fresh.
  schedule:
    - cron: "10 0 * * *"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Create 3 indexes (rows_read fix)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --command "CREATE INDEX IF NOT EXISTS idx_villages_subdistrict ON villages(sub_district_id);"
          npx --yes wrangler d1 execute pincode-india-db --remote --command "CREATE INDEX IF NOT EXISTS idx_villages_lgd ON villages(lgd_code);"
          npx --yes wrangler d1 execute pincode-india-db --remote --command "CREATE INDEX IF NOT EXISTS idx_lgd_panchayats_code ON lgd_panchayats(lgd_code);"

      - name: Verify indexes exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --command "SELECT name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' ORDER BY name;" --json
