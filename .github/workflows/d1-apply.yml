name: D1 Apply Seed Data
on:
  schedule:
    - cron: '50 23 * * *'  # 23:50 UTC - 10 min before the 00:00 UTC D1 write-limit reset, so seed writes consume the ENDING day's quota and the new day stays free for other work (limit is PER ACCOUNT ~100k rows/day on free tier)
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Max rows to WRITE this run (account-wide ~100k row writes/day on free tier)'
        default: '90000'
      release_asset:
        description: 'Download URL of the seed zip (release asset)'
        default: 'https://github.com/skmstudioservices-cyber/digipincode-india/releases/download/d1-data-v1/d1-populate-sql.zip'
        required: true

env:
  D1_DB: pincode-india-db   # apac location (closest to India). Old DB `pincode-india` (wnam) has been deleted - cutover done.

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download seed data
        run: |
          curl -sL "${{ github.event.inputs.release_asset || 'https://github.com/skmstudioservices-cyber/digipincode-india/releases/download/d1-data-v1/d1-populate-sql.zip' }}" -o seed.zip
          unzip -q seed.zip -d populate
          python3 -c "import json; m=json.load(open('populate/manifest.json')); print('manifest files:', len(m['files']), 'total rows:', m['total_rows'])"
      - name: Ensure schema on target DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute pincode-india-db --remote --file=./schema.sql
      - name: Apply seed SQL (budget-aware, resumable)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-populate.mjs "${{ github.event.inputs.max_rows || '90000' }}"
