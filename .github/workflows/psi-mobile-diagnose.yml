name: PSI Mobile Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check HTML weight, status, DOM size
        run: |
          set -e
          B=https://digipincode.india-in.workers.dev
          # pick a live village URL from the sitemap
          VIL=$(curl -s "$B/sitemap-haryana.xml" | grep -o '<loc>[^<]*village-[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g')
          echo "VILLAGE=$VIL"
          for u in "/" "/states" "/andhra-pradesh/" "/andhra-pradesh/district-krishna/" "/haryana/district-jhajjar/tehsil-bahadurgarh/" "$VIL"; do
            out=$(curl -s -o /tmp/p.html -w "%{http_code} %{size_download} %{time_total}" "$B$u")
            divs=$(grep -o '<div' /tmp/p.html | wc -l)
            anchors=$(grep -o '<a ' /tmp/p.html | wc -l)
            nodes=$(python3 -c "import re,sys; print(len(re.findall(r'<[a-z]', open('/tmp/p.html').read())))")
            echo "$u -> code/size/time: $out | divs: $divs | anchors: $anchors | total-tags: $nodes"
            grep -o 'name="viewport"[^>]*' /tmp/p.html | head -1 || echo "NO VIEWPORT META"
          done
          # repeat homepage with a mobile UA (rule out UA sniffing)
          mout=$(curl -s -A "Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36" -o /tmp/m.html -w "%{http_code} %{size_download}" "$B/")
          echo "homepage mobile-UA -> $mout"

      - name: Run Lighthouse MOBILE (PSI engine) on key pages
        run: |
          set +e
          B=https://digipincode.india-in.workers.dev
          VIL=$(curl -s "$B/sitemap-haryana.xml" | grep -o '<loc>[^<]*village-[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g')
          mkdir -p /tmp/lh
          for u in "/" "/andhra-pradesh/" "/haryana/district-jhajjar/tehsil-bahadurgarh/" "$VIL"; do
            name=$(echo "$u" | tr '/' '_')
            echo "=== Lighthouse mobile: $u ==="
            npx --yes lighthouse "$B$u" \
              --output=json --output-path="/tmp/lh$name.json" \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,seo \
              --quiet || echo "LIGHTHOUSE EXIT CODE: $?"
            if [ -f "/tmp/lh$name.json" ]; then
              cat "/tmp/lh$name.json" | python3 -c "
import json,sys
try:
  d=json.load(sys.stdin)
  print('runtimeError:', json.dumps(d.get('runtimeError')))
  print('runWarnings:', d.get('runWarnings'))
  cats=d.get('categories',{})
  print('scores:', {k: (v.get('score') if isinstance(v,dict) else v) for k,v in cats.items()})
  a=d.get('audits',{})
  for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','server-response-time','dom-size','total-byte-weight']:
    if k in a: print(f'{k}:', a[k].get('displayValue'), '| score:', a[k].get('score'))
except Exception as e:
  print('parse err', e)
"
            else
              echo "NO REPORT GENERATED"
            fi
          done
