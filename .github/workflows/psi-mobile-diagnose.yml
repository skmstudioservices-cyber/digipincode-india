name: PSI Mobile Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run Lighthouse MOBILE (PSI engine) on key pages
        run: |
          set +e
          B=https://digipincode.india-in.workers.dev
          VIL=$(curl -s "$B/sitemap-haryana.xml" | grep -o '<loc>[^<]*village-[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g')
          VIL=${VIL#"$B"}
          echo "VILLAGE PATH=$VIL"
          mkdir -p /tmp/lh
          for u in "/" "/andhra-pradesh/" "/haryana/district-jhajjar/tehsil-bahadurgarh/" "$VIL"; do
            name=$(echo "$u" | tr '/' '_')
            echo "=== Lighthouse mobile: $u ==="
            npx --yes lighthouse "$B$u" --output=json --output-path="/tmp/lh$name.json" --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,seo --quiet
            echo "LIGHTHOUSE EXIT CODE: $?"
            if [ -f "/tmp/lh$name.json" ]; then
              jq '{perf: .categories.performance.score, acc: .categories.accessibility.score, seo: .categories.seo.score, fcp: .audits["first-contentful-paint"].displayValue, lcp: .audits["largest-contentful-paint"].displayValue, tbt: .audits["total-blocking-time"].displayValue, cls: .audits["cumulative-layout-shift"].displayValue}' "/tmp/lh$name.json"
              echo "--- FAILING AUDITS (score < 1) ---"
              jq '[.audits | to_entries[] | select(.value.score != null and .value.score < 1) | {id: .key, score: .value.score, title: .value.title}]' "/tmp/lh$name.json"
              echo "--- A11Y AUDIT ITEM DETAILS ---"
              jq '[.audits | to_entries[] | select(.value.score == 0) | {id: .key, items: (.value.details.items // [] | .[:3])}]' "/tmp/lh$name.json"
            else
              echo "NO REPORT GENERATED"
            fi
          done
