name: Robots Audit (Googlebot allow/deny per site)

# Fetches robots.txt for every site and decides whether GOOGLEBOT is allowed,
# by parsing user-agent GROUPS properly. This is the check the external audit
# tool gets wrong: it reads every "Disallow: /" in the file as if it applied to
# Googlebot, when those lines belong to separate AI/SEO-crawler groups.
#
# Sends the Googlebot user-agent, so the response is what Google would see.

on:
  workflow_dispatch:
  push:
    paths:
      - 'robots-audit/run.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check every site
        run: |
          set +e
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          SLUGS="toiletsnearme washroomsnearme restareanearme evchargersnearme petrolpumpsnearme cngpumpsnearme karvachauth banksnearme atmsnearme hospitalsnearme-9cp hospitalsnearme railwaystationnearme floodsnearme templesnearme churchesnearme mosquesnearme cafenearme gymnearme salonnearme parksnearme lodgenearme bakerynearme dhabanearme hotelnearme tailorshopnearme medicalshopnearme mobilerepairnearme mechanicnearme tirenearme paintshopnearme hardwareshopnearme sweetsshopnearme laundrynearme policestationsnearme postofficenearme rtoofficenearme courtnearme busstopnearme busstationnearme autostandnearme bikestandnearme erickshawstandnearme bicyclestandnearme carparkingnearme tollplazanearme rationcardofficernearme aadhaarcenternearme aadhaar-seva-kendra-near-me bloodbanksnearme airqualitynearme earthquakenearme protestsnearme skmtools demo-vmv mapsnearme isrotracker issspotter bharatlive asiangamesmedaltally2026 subhammaddheshiya skmstudio safealleys dentistsnearme electricityofficernearme restaurantsnearme thananearme bikerepairsnearme carrepairsnearme"

          cat > /tmp/parse.py <<'PY'
          import sys
          path = sys.argv[1]
          try:
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
          except Exception:
              print("NO-FILE"); raise SystemExit
          cur, gb_blocked, star_blocked = [], False, False
          for l in lines:
              l = l.strip()
              if not l or l.startswith("#"):
                  continue
              low = l.lower()
              if low.startswith("user-agent:"):
                  cur = [x.strip().lower() for x in l.split(":", 1)[1].split(",")]
              elif low.startswith("disallow:"):
                  p = l.split(":", 1)[1].strip()
                  if p in ("/", "/*"):
                      if "googlebot" in cur:
                          gb_blocked = True
                      if "*" in cur:
                          star_blocked = True
          # robots.txt SPECIFICITY RULE: if a group names Googlebot, that group
          # governs Googlebot entirely and the "*" group is ignored for it.
          # Flagging "BLOCKED-BY-STAR" without this check is a false positive —
          # the same mistake the external audit tool makes.
          has_gb_group = False
          for l in lines:
              l = l.strip().lower()
              if l.startswith("user-agent:") and "googlebot" in l:
                  has_gb_group = True
          if gb_blocked:
              print("BLOCKED")
          elif has_gb_group:
              print("ALLOWED")
          elif star_blocked:
              print("BLOCKED-BY-STAR")
          else:
              print("ALLOWED")
          PY

          printf "%-38s %-5s %-15s %s\n" SITE HTTP GOOGLEBOT NOTE
          blocked=""
          for s in $SLUGS; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -m 20 -A "$UA" "https://$s.pages.dev/robots.txt")
            v=$(python3 /tmp/parse.py /tmp/r.txt)
            sm=$(grep -ci "^sitemap:" /tmp/r.txt)
            note="sitemap-lines=$sm"
            [ "$v" != "ALLOWED" ] && { note="$note  <-- CHECK"; blocked="$blocked $s:$v"; }
            printf "%-38s %-5s %-15s %s\n" "$s" "$code" "$v" "$note"
          done

          echo
          echo "=== WORKERS ==="
          for h in examstatus.india-in.workers.dev digipincode.india-in.workers.dev karvachauth.india-in.workers.dev skmtools.india-in.workers.dev sitemaps.india-in.workers.dev; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -m 20 -A "$UA" "https://$h/robots.txt")
            v=$(python3 /tmp/parse.py /tmp/r.txt)
            [ "$v" != "ALLOWED" ] && blocked="$blocked $h:$v"
            printf "%-38s %-5s %-15s\n" "$h" "$code" "$v"
            if [ "$v" != "ALLOWED" ]; then
              echo "    ---- exact group that triggered it ----"
              awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*User-agent:/{ua=$0} /^[[:space:]]*Disallow:[[:space:]]*\/(\*)?[[:space:]]*$/{print "    " ua "  ==>  " $0}' /tmp/r.txt
              echo "    ---- end ----"
            fi
          done

          echo
          echo "=== SUMMARY ==="
          if [ -z "$blocked" ]; then
            echo "Every site ALLOWS Googlebot. No robots.txt change needed."
          else
            echo "Googlebot blocked on:$blocked"
          fi
