name: Setup mapsnearme infrastructure
on:
  workflow_dispatch:

concurrency:
  group: setup-mapsnearme-infra
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Create D1 database mapsnearme
        run: wrangler d1 create mapsnearme || echo "D1 mapsnearme already exists (skipping)"

      - name: Create KV namespace mapsnearme_ads
        run: wrangler kv namespace create MAPSNEARME_ADS || echo "KV namespace already exists (skipping)"

      - name: Create R2 bucket mapsnearme-images
        run: wrangler r2 bucket create mapsnearme-images || echo "R2 bucket create failed or already exists (skipping)"

      - name: Create Pages project mapsnearme
        run: wrangler pages project create mapsnearme --production-branch main || echo "Pages project mapsnearme already exists (skipping)"

      - name: Create Pages project dashboardmapsnearme
        run: wrangler pages project create dashboardmapsnearme --production-branch main || echo "Pages project dashboardmapsnearme already exists (skipping)"

      - name: Deploy mapsnearme routing proxy worker
        run: |
          mkdir -p /tmp/proxy/src
          cat > /tmp/proxy/wrangler.toml <<'TOML'
          name = "mapsnearme"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          TOML
          cat > /tmp/proxy/src/index.js <<'JS'
          // mapsnearme routing proxy (reverse proxy Worker)
          // Public site: mapsnearme.pages.dev (Astro)
          // Dashboard: dashboardmapsnearme.pages.dev (Astro, base /dashboard)
          // Single entry: mapsnearme.india-in.workers.dev
          const PUBLIC_SITE = "https://mapsnearme.pages.dev";
          const DASHBOARD = "https://dashboardmapsnearme.pages.dev";

          export default {
            async fetch(request) {
              const url = new URL(request.url);
              if (url.pathname === "/dashboard") {
                // Canonicalize to trailing slash so relative asset URLs resolve correctly.
                return Response.redirect(new URL("/dashboard/", url).toString(), 301);
              }
              let base;
              let path;
              if (url.pathname === "/dashboard/" || url.pathname.startsWith("/dashboard/")) {
                base = DASHBOARD;
                // Keep the /dashboard prefix: the dashboard app is built with
                // Astro base "/dashboard", so its routes and assets live under it.
                path = url.pathname;
              } else {
                base = PUBLIC_SITE;
                path = url.pathname;
              }
              const target = new URL(path + url.search, base);
              const proxyReq = new Request(target, request);
              proxyReq.headers.set("x-forwarded-host", url.hostname);
              return fetch(proxyReq);
            },
          };
          JS
          cd /tmp/proxy
          wrangler deploy

      - name: Collect created resource IDs
        run: |
          echo "=== D1 databases (JSON) ==="
          wrangler d1 list --json || true
          echo "=== KV namespaces (JSON) ==="
          wrangler kv namespace list --json || true
          echo "=== R2 buckets (JSON) ==="
          wrangler r2 bucket list --json || true
          echo "=== Pages projects ==="
          wrangler pages project list || true
