name: Monetag Ad Test (Playwright)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i playwright@latest && npx playwright install --with-deps chromium
      - run: |
          mkdir -p shots
          cat > adtest.mjs <<'JS'
          import { chromium } from 'playwright';
          const urls = ['https://toiletsnearme.pages.dev/','https://evchargersnearme.pages.dev/'];
          const b = await chromium.launch();
          for (const u of urls) {
            const p = await b.newPage({ viewport:{width:390,height:844} });
            const reqs = [];
            p.on('request', r => { const s=r.url(); if (s.includes('quge5')||s.includes('monetag')||s.includes('tag.min.js')) reqs.push(s); });
            const errs = [];
            p.on('pageerror', e => errs.push(String(e).slice(0,100)));
            await p.goto(u, { waitUntil:'networkidle', timeout:60000 }).catch(()=>{});
            await p.waitForTimeout(6000);
            const tag = await p.evaluate(() => !!document.querySelector('script[src*="quge5"]'));
            const sw = await fetch(u.replace(/\/$/,'')+'/sw.js').then(r=>r.status).catch(()=>0);
            const frames = p.frames().length;
            const adEls = await p.evaluate(() => document.querySelectorAll('iframe,[id*=monetag],[class*=monetag],[id*=push]').length);
            await p.screenshot({ path:'shots/'+u.replace(/[^a-z0-9]/gi,'_').slice(-40)+'.png' });
            console.log('ADTEST |', u, '| scriptPresent:', tag, '| adRequests:', reqs.length, '| frames:', frames, '| adEls:', adEls, '| sw.js:', sw, '| errors:', errs.join('||')||'none');
            if (reqs.length) console.log('   requests:', reqs.slice(0,4).join(' , '));
            await p.close();
          }
          await b.close();
          JS
          node adtest.mjs
      - uses: actions/upload-artifact@v4
        with: { name: ad-shots, path: shots/, retention-days: 3 }
