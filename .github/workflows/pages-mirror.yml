name: Mirror site to Pages (digipincode.pages.dev)

on:
  workflow_dispatch:

concurrency:
  group: pages-mirror-digipincode
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Create Pages project (first run)
        run: npx --yes wrangler pages project create digipincode --production-branch=main || echo "PROJECT_EXISTS_OR_NAME_TAKEN"

      - name: Deploy to Pages (mirror)
        run: npx --yes wrangler pages deploy --project-name=digipincode --branch=main --commit-dirty=true --config wrangler-pages.toml
