name: Build url_index (flat URL lookup)

on:
  # Do NOT manually re-dispatch: each run writes rows; the 100k/day write
  # limit is shared with the live site. Daily schedule is enough.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump D1 lookup tables (top tiers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT slug,name FROM states ORDER BY name;" > states.json
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT d.slug AS slug,d.name AS name,s.slug AS state_slug,s.name AS state_name FROM districts d JOIN states s ON s.id=d.state_id;" > districts.json
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT sd.slug AS slug,sd.name AS name,d.slug AS district_slug,d.name AS district_name,s.slug AS state_slug,s.name AS state_name FROM sub_districts sd JOIN districts d ON d.id=sd.district_id JOIN states s ON s.id=d.state_id;" > subdistricts.json
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT l.block_name AS name,d.slug AS district_slug,d.name AS district_name,s.slug AS state_slug,s.name AS state_name FROM lgd_panchayats l JOIN districts d ON d.id=l.district_id JOIN states s ON s.id=d.state_id WHERE l.block_name IS NOT NULL GROUP BY l.block_name,d.id;" > blocks.json || echo "[]" > blocks.json
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT p.pincode AS pincode,p.taluk AS taluk,p.office_name AS office_name,d.slug AS district_slug,d.name AS district_name,s.slug AS state_slug,s.name AS state_name FROM pincodes p JOIN districts d ON d.id=p.district_id JOIN states s ON s.id=p.state_id;" > pincodes.json
      - name: Build url-index.sql (top tiers)
        run: node scripts/backfill-url-index.mjs
      - name: Apply top-tier rows to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute pincode-india-db --remote --file=./url-index.sql
      - name: Villages batched (D1 write-safe 20k rows per run (never manual re-dispatch))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --command "CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT);"
          npx --yes wrangler d1 execute pincode-india-db --remote --command "INSERT OR IGNORE INTO url_index (url_path,kind,state_slug,district_slug,sub_slug,village_slug,pincode) SELECT 'india-IN-state-'||s.slug||'-district-'||d.slug||'-subdistrict-'||sd.slug||'-tehsil-'||sd.slug||'-village-'||v.slug||'-pincode-'||v.pincode, 'village', s.slug, d.slug, sd.slug, v.slug, v.pincode FROM villages v JOIN sub_districts sd ON sd.id=v.sub_district_id JOIN districts d ON d.id=sd.district_id JOIN states s ON s.id=d.state_id WHERE v.pincode IS NOT NULL AND v.id > CAST(COALESCE((SELECT v FROM meta WHERE k='village_cursor'),'0') AS INTEGER) ORDER BY v.id LIMIT 20000;"
          npx --yes wrangler d1 execute pincode-india-db --remote --command "INSERT INTO meta(k,v) SELECT 'village_cursor', CAST(MAX(id) AS TEXT) FROM (SELECT v.id AS id FROM villages v WHERE v.pincode IS NOT NULL AND v.id > CAST(COALESCE((SELECT v FROM meta WHERE k='village_cursor'),'0') AS INTEGER) ORDER BY v.id LIMIT 20000);"
