name: D1 Refresh Trending
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply trending pincode queries seed to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          set -x
          echo "=== wrangler.jsonc ==="
          cat wrangler.jsonc
          DB=$(grep -o '"database_name" *: *"[^"]*"' wrangler.jsonc | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "PARSED_DB=$DB"
          if [ -z "$DB" ]; then echo "NO_DB_FOUND"; exit 1; fi
          npx --yes wrangler@latest d1 execute "$DB" --remote --file ops/trending-queries.sql 2>&1 | tail -10
          echo "=== VERIFY ==="
          npx --yes wrangler@latest d1 execute "$DB" --remote --command "SELECT COUNT(*) AS total FROM trending_queries" 2>&1 | tail -10
