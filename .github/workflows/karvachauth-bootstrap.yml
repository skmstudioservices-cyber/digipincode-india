name: Karvachauth Bootstrap

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build karvachauth site (with GSC tag)
        run: cd karvachauth && npm install --no-fund --no-audit && node generate.js

      - name: Create Pages project (first run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create karvachauth --production-branch=main || echo "project already exists"

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy karvachauth/dist --project-name=karvachauth --branch=main --commit-dirty=true

      - name: Verify GSC tag live
        run: |
          sleep 25
          code=$(curl -s -o /tmp/kc.html -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "https://karvachauth.pages.dev/")
          echo "karvachauth.pages.dev -> HTTP $code ($(wc -c < /tmp/kc.html) bytes)"
          grep -o 'google-site-verification" content="[^"]*' /tmp/kc.html && echo "GSC TAG LIVE" || echo "GSC TAG NOT FOUND"
          sitemap=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://karvachauth.pages.dev/sitemap.xml")
          echo "sitemap.xml -> HTTP $sitemap"
