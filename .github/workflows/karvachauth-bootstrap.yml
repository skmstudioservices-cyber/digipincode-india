name: Karvachauth Bootstrap

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build karvachauth site (with GSC tag)
        run: cd karvachauth && npm install --no-fund --no-audit && node generate.js

      - name: Create Pages project (first run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create karvachauth --production-branch=main || echo "project already exists"

      - name: Deploy to Pages (karvachauth.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy karvachauth/dist --project-name=karvachauth --branch=main --commit-dirty=true

      - name: Deploy to Workers (karvachauth.india-in.workers.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd karvachauth && npx --yes wrangler deploy

      - name: Verify GSC tag live (both hosts)
        run: |
          sleep 25
          for host in karvachauth.pages.dev karvachauth.india-in.workers.dev; do
            code=$(curl -s -o /tmp/k.html -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "https://$host/")
            echo "=== $host -> HTTP $code ($(wc -c < /tmp/k.html) bytes)"
            grep -o 'google-site-verification" content="[^"]*' /tmp/k.html && echo "GSC TAG LIVE" || echo "GSC TAG NOT FOUND"
          done
