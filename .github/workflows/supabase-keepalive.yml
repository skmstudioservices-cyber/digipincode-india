name: Supabase Keep-Alive (every 3 days)

# Free Supabase projects PAUSE after ~7 days of inactivity. This pings every
# project every 3 days (a safe margin) so none of them ever pauses.
#
# Keyless by default (auth health endpoint + REST root). If you add a repo
# secret SUPABASE_ANON_KEY, it also runs a real REST read for a stronger signal.
# 21 Oct 2026 — user rule: read ALL Supabase projects every 3 days.
#
# 07 Nov 2026 — fix: a PAUSED project (DNS removed) made curl exit 6, and
# `bash -e` killed the whole job before the second project was pinged.
# Also Supabase now returns 401 on /auth/v1/health without an apikey, so 401
# counts as healthy. The job now reports and never fails on a paused project.

on:
  schedule:
    - cron: '20 3 */3 * *'   # every 3rd day, 08:50 IST
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Supabase projects
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          PROJECTS="
          timnrnmmmmuqmcnuaend|skmstudioservices-cyber's Project Maps
          hfmkznptehdhtgsuwzri|mapsnearme
          "
          while IFS='|' read -r REF NAME; do
            [ -z "$REF" ] && continue
            h=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://${REF}.supabase.co/auth/v1/health"); h=${h:-000}
            r=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://${REF}.supabase.co/rest/v1/"); r=${r:-000}
            k="skipped"
            if [ -n "$SUPABASE_ANON_KEY" ]; then
              k=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://${REF}.supabase.co/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"); k=${k:-000}
            fi
            if [ "$h" = "000" ] && [ "$r" = "000" ]; then
              state="PAUSED/UNREACHABLE"
            else
              state="ok"
            fi
            echo "KEEPALIVE | ${REF} (${NAME}) | auth-health ${h} | rest-root ${r} | keyed-read ${k} | ${state}"
          done <<< "$PROJECTS"
          echo "done — paused projects are reported above, not treated as job failures"
          exit 0
