name: Verify monitor UA (temp)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-monitor-ua.yml']
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: Probe redirects and sitemap shape
        run: |
          M="skm-site-monitor/1.0 (+https://skmstudio.pages.dev)"
          for u in / /state/uttar-pradesh /state/uttar-pradesh/ /pincode/110001 /pincode/110001/ ; do
            echo "HDR $u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -A "$M" --max-time 30 "https://digipincode.india-in.workers.dev$u")"
          done
          echo "--- index ---"
          curl -s -A "$M" --max-time 40 https://digipincode.india-in.workers.dev/sitemap.xml | head -20
          echo "--- child sample ---"
          curl -s -A "$M" --max-time 60 https://digipincode.india-in.workers.dev/sitemap/pages.xml | head -12
          echo "--- child count ---"
          curl -s -A "$M" --max-time 60 https://digipincode.india-in.workers.dev/sitemap/pages.xml | grep -c "<loc>"
