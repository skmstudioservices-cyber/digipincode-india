name: Nexus CMS Browser Verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -D playwright@latest && npx playwright install --with-deps chromium
      - name: Test drag-drop nesting
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1440, height: 1000 } });
          const errs = [];
          p.on('pageerror', (e) => errs.push('PAGEERROR: ' + e.message));
          p.on('console', (m) => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
          await p.goto('https://my-cms-dashboard.india-in.workers.dev/', { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(3000);
          console.log('PALETTE=' + await p.locator('#palette [data-add]').count());
          await p.locator('[data-add="container"]').click();
          await p.locator('[data-add="card"]').click();
          await p.waitForTimeout(400);
          console.log('TOP_BLOCKS=' + await p.locator('#canvas > .wf-node').count());
          await p.dragAndDrop('.wf-node[data-id^="card-"] .wf-handle', '.wf-children .drop-slot');
          await p.waitForTimeout(700);
          const nested = await p.evaluate(() => { const z = document.querySelector('.wf-children'); return z ? !!z.querySelector('.wf-node[data-id^="card-"]') : false; });
          console.log('DRAGGED_INTO_CONTAINER=' + nested);
          console.log('TOP_AFTER=' + await p.locator('#canvas > .wf-node').count());
          await p.locator('#btnCode').click();
          await p.waitForTimeout(500);
          const code = await p.locator('#codeOut').innerText();
          console.log('CODE_HAS_COMMENT=' + code.includes('<!-- BLOCK:') + ' CODE_LEN=' + code.length);
          console.log('ERRORS=' + JSON.stringify(errs.slice(0, 12)));
          await b.close();
          EOF
          node check.mjs
