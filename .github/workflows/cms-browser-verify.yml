name: Nexus CMS Browser Verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -D playwright@latest && npx playwright install --with-deps chromium
      - name: Load dashboard in a real browser
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = process.env.CMS_URL || 'https://my-cms-dashboard.india-in.workers.dev/?view=actual';
          const b = await chromium.launch();
          const p = await b.newPage();
          const errs = [];
          p.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
          p.on('console', m => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
          await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(5000);
          const tabs = await p.locator('.nav-item').count();
          const stats = await p.locator('.stat').count();
          const vt = await p.locator('#view').innerText();
          const fs = await p.evaluate(() => getComputedStyle(document.body).fontSize);
          const fg = await p.evaluate(() => getComputedStyle(document.body).color);
          const bg = await p.evaluate(() => getComputedStyle(document.body).backgroundColor);
          console.log('TABS=' + tabs + ' STATS=' + stats + ' VIEWLEN=' + vt.length);
          console.log('A11Y_FONTSIZE=' + fs + ' FG=' + fg + ' BG=' + bg);
          await p.click('button[aria-label="Switch light or dark theme"]');
          await p.waitForTimeout(600);
          console.log('THEME_AFTER_TOGGLE=' + await p.evaluate(() => document.documentElement.getAttribute('data-theme')));
          for (const t of ['sites','comments','vault']) {
            if (t === 'vault') { await p.goto('https://my-cms-dashboard.india-in.workers.dev/vault', { waitUntil: 'domcontentloaded' }); console.log('VAULT len=' + (await p.locator('body').innerText()).length); continue; }
            await p.click('.nav-item[data-tab="' + t + '"]');
            await p.waitForTimeout(2000);
            console.log('TAB ' + t + ' len=' + (await p.locator('#view').innerText()).length);
          }
          console.log('ERRORS=' + JSON.stringify(errs.slice(0, 20)));
          await b.close();
          EOF
          node check.mjs
