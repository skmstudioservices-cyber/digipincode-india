name: Nexus CMS Browser Verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -D playwright@latest && npx playwright install --with-deps chromium
      - name: Load + check design tokens
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1440, height: 1000 } });
          const errs = [];
          p.on('pageerror', (e) => errs.push('PAGEERROR: ' + e.message));
          p.on('console', (m) => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
          await p.goto('https://my-cms-dashboard.india-in.workers.dev/', { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(5000);
          const cs = (sel, prop) => p.evaluate(([s, pr]) => { const e = document.querySelector(s); return e ? getComputedStyle(e)[pr] : 'none'; }, [sel, prop]);
          console.log('BODY_BG=' + await cs('body', 'backgroundColor'));
          console.log('CARD_BG=' + await cs('.card', 'backgroundColor') + ' CARD_RADIUS=' + await cs('.card', 'borderRadius'));
          console.log('SIDE_BG=' + await cs('.drawer-side', 'backgroundColor') + ' SIDE_TEXT=' + await cs('.drawer-side', 'color'));
          console.log('PRIMARY=' + await cs('.btn-primary', 'backgroundColor') + ' NAVBAR_BG=' + await cs('header.navbar', 'backgroundColor'));
          console.log('BREADCRUMB=' + await p.locator('.breadcrumbs').count() + ' SEARCH=' + await p.locator('#gsearch').count() + ' AVATAR=' + await p.locator('.avatar').count());
          console.log('CMT_CHIPS=' + await p.locator('.blk-cmt, .blk-cmt-i').count() + ' COPY_ALL=' + await p.locator('#btnCopyAll').count());
          console.log('ERRORS=' + JSON.stringify(errs.slice(0, 12)));
          await p.screenshot({ path: 'cms.png', fullPage: true });
          await b.close();
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-shot
          path: cms.png
