name: Nexus CMS Browser Verify
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -D playwright@latest && npx playwright install --with-deps chromium
      - name: Load + test element tools + colour wheel
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage();
          const errs = [];
          p.on('pageerror', (e) => errs.push('PAGEERROR: ' + e.message));
          p.on('console', (m) => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
          await p.goto('https://my-cms-dashboard.india-in.workers.dev/', { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(5000);
          console.log('TABS=' + await p.locator('.nav-item').count() + ' STATS=' + await p.locator('.stat').count());
          console.log('BLK_TOOLS=' + await p.locator('.blk-tools').count() + ' CMT_BTNS=' + await p.locator('[data-cmt]').count() + ' COLOR_BTNS=' + await p.locator('[data-color]').count());
          await p.locator('[data-cmt]').first().click();
          await p.waitForTimeout(700);
          console.log('COMMENT_DIALOG_OPEN=' + await p.evaluate(() => !!document.querySelector('#dlgComment')?.open));
          await p.keyboard.press('Escape');
          await p.locator('[data-color]').first().click();
          await p.waitForTimeout(700);
          console.log('COLOR_DIALOG_OPEN=' + await p.evaluate(() => !!document.querySelector('#dlgColor')?.open) + ' COLOR_WHEEL=' + await p.locator('#colPick').count());
          console.log('THEME_TOGGLE=' + await p.evaluate(async () => { document.getElementById('btnTheme').click(); return document.documentElement.getAttribute('data-theme'); }));
          console.log('ERRORS=' + JSON.stringify(errs.slice(0, 15)));
          await p.screenshot({ path: 'cms.png', fullPage: true });
          await b.close();
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-shot
          path: cms.png
