name: Nexus CMS Browser Verify

# Gate 4.0a (Web Deploy QA): JS-driven UI needs a real browser check.
on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i -D playwright@latest && npx playwright install --with-deps chromium
      - name: Load dashboard in a real browser
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = process.env.CMS_URL || 'https://my-cms-dashboard.india-in.workers.dev/?view=actual';
          const b = await chromium.launch();
          const p = await b.newPage();
          const errs = [];
          p.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
          p.on('console', m => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
          p.on('requestfailed', r => errs.push('REQFAIL: ' + r.url() + ' ' + (r.failure() && r.failure().errorText)));
          await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(5000);
          const tabs = await p.locator('.nav-item').count();
          const stats = await p.locator('.stat').count();
          const viewText = await p.locator('#view').innerText();
          console.log('TABS=' + tabs + ' STATS=' + stats + ' VIEWLEN=' + viewText.length);
          console.log('VIEW_HEAD=' + JSON.stringify(viewText.slice(0, 300)));
          for (const t of ['sites','d1','comments','github','analytics']) {
            await p.click('.nav-item[data-tab="' + t + '"]');
            await p.waitForTimeout(2500);
            const vt = await p.locator('#view').innerText();
            console.log('TAB ' + t + ' len=' + vt.length + ' :: ' + JSON.stringify(vt.slice(0, 160)));
          }
          console.log('ERRORS=' + JSON.stringify(errs.slice(0, 25), null, 1));
          await p.screenshot({ path: 'cms.png', fullPage: true });
          await b.close();
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-screenshot
          path: cms.png
