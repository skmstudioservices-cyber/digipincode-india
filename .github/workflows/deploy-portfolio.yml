name: Deploy portfolio sites (bridge)

# Bridge deploy: builds the site repos with Node 22 and pushes the output to
# their Cloudflare Pages projects using this repo's CF token. Used when the
# Pages Git build lags or the Cloudflare GitHub App has no access to the repo.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "skmstudio | subhammaddheshiya | digipincode-static | toiletsnearme | all"
        required: false
        default: "all"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Build + deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -euo pipefail
          get() { curl -sSL "https://codeload.github.com/skmstudioservices-cyber/$1/tar.gz/refs/heads/main" | tar -xz -C "$2" --strip-components=1; }

          if [ "$SITE" = "all" ] || [ "$SITE" = "skmstudio" ]; then
            rm -rf /tmp/a && mkdir -p /tmp/a && get SKM-Studio /tmp/a
            (cd /tmp/a && npm install --no-audit --no-fund && npm run build && npx --yes wrangler@4 pages deploy dist --project-name=skmstudio --branch=main --commit-dirty=true)
          fi

          if [ "$SITE" = "all" ] || [ "$SITE" = "subhammaddheshiya" ]; then
            rm -rf /tmp/b && mkdir -p /tmp/b && get Subham-Maddheshiya /tmp/b
            (cd /tmp/b && npm install --no-audit --no-fund && npm run build && npx --yes wrangler@4 pages deploy dist --project-name=subhammaddheshiya --branch=main --commit-dirty=true)
          fi

          if [ "$SITE" = "all" ] || [ "$SITE" = "digipincode-static" ]; then
            rm -rf /tmp/c && mkdir -p /tmp/c && get digipincode-static /tmp/c
            (cd /tmp/c && npm install --no-audit --no-fund && npm run build && npx --yes wrangler@4 pages deploy dist --project-name=digipincode-static --branch=preview --commit-dirty=true)
          fi

          # toiletsnearme is pure static HTML — no build step, deploy the repo root
          # (minus .github/scripts) so every fix lands immediately, bypassing the
          # Pages Git build queue.
          if [ "$SITE" = "all" ] || [ "$SITE" = "toiletsnearme" ]; then
            rm -rf /tmp/d && mkdir -p /tmp/d && get toiletsnearme /tmp/d
            rm -rf /tmp/d/.github /tmp/d/scripts
            (cd /tmp/d && npx --yes wrangler@4 pages deploy . --project-name=toiletsnearme --branch=main --commit-dirty=true)
          fi
