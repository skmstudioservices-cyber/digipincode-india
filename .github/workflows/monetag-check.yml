name: Monetag Tag Check

# 25 Oct 2026 FIX: the previous version was UNPARSEABLE by GitHub (it answered
# "Workflow does not have 'workflow_dispatch' trigger" on dispatch, and reported
# "No jobs were run / 0.0s" by file path on every push - that was the email
# flood). Rewritten as clean, valid YAML. It now reports all THREE Monetag parts
# separately per site: zone tag, verification meta, and sw.js.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Monetag tag + meta + sw.js
        run: |
          urls="
          https://toiletsnearme.pages.dev/
          https://evchargersnearme.pages.dev/
          https://airqualitynearme.pages.dev/
          https://gymnearme.pages.dev/
          https://tailorshopnearme.pages.dev/
          https://busstationnearme.pages.dev/
          https://busstopnearme.pages.dev/
          https://railwaystationnearme.pages.dev/
          https://safealleys.pages.dev/
          https://floodsnearme.pages.dev/
          "
          for u in $urls; do
            body=$(curl -s -L --max-time 30 "$u?cb=$RANDOM")
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$u")
            sw=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "${u}sw.js")
            tag=$(printf '%s' "$body" | grep -c 'quge5.com/88/tag.min.js')
            zone=$(printf '%s' "$body" | grep -oE 'data-zone="[0-9]+"' | head -1)
            meta=$(printf '%s' "$body" | grep -oE 'name="monetag" content="[a-f0-9]+"' | head -1)
            echo "MONCHECK | HTTP $code | sw.js $sw | tag=$tag | ${zone:-NO-ZONE} | ${meta:-NO-META} | $u"
          done
