name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Resolve D1 database ID
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
            | jq -r '.result[] | select(.name=="pincode-india") | .uuid' | head -n1 || true)
          if [ -z "${DB_ID:-}" ]; then
            echo "Database 'pincode-india' not found - creating it..."
            DB_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" \
              -d '{"name":"pincode-india"}' | jq -r '.result.uuid')
          fi
          if [ -z "${DB_ID:-}" ] || [ "$DB_ID" = "null" ]; then
            echo "ERROR: could not resolve D1 database ID. Check that the API token has D1 edit permission."
            exit 1
          fi
          echo "Resolved D1 database ID: $DB_ID"
          sed -i "s/YOUR_D1_DATABASE_ID/$DB_ID/g" wrangler.jsonc skm-ai-worker/wrangler.jsonc

      - name: Run D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute pincode-india --file=./schema.sql --remote
          workingDirectory: .

      - name: Deploy Astro site to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name digipincode
          workingDirectory: .

      - name: Deploy AI worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ./skm-ai-worker
