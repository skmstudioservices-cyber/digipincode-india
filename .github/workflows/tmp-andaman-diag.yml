name: Tmp Andaman Diag (one-off)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          for u in andaman-and-nicobar-islands kerala chhattisgarh; do
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 25 "https://digipincode.india-in.workers.dev/$u?cb=$RANDOM$i")
              echo "PAGE /$u try$i -> $code"
              if [ "$code" != "200" ]; then echo "--- body head ---"; head -c 500 /tmp/body.html; echo; fi
            done
          done
      - name: D1 state row
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT id, slug, name FROM states WHERE slug='andaman-and-nicobar-islands'"
      - name: D1 districts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT COUNT(*) AS n FROM districts WHERE state_id=(SELECT id FROM states WHERE slug='andaman-and-nicobar-islands')"
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT id, slug, name FROM districts WHERE state_id=(SELECT id FROM states WHERE slug='andaman-and-nicobar-islands') ORDER BY name LIMIT 40"
          npx --yes wrangler d1 execute pincode-india-db --remote --json --command "SELECT district_id, COUNT(*) AS sd_count FROM sub_districts WHERE district_id IN (SELECT id FROM districts WHERE state_id=(SELECT id FROM states WHERE slug='andaman-and-nicobar-islands')) GROUP BY district_id"
