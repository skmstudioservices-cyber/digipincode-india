name: Repo Dump (temp)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump3
        run: |
          echo "=== index.astro FULL ==="
          cat -A /dev/null; cat src/pages/index.astro
          echo "=== d1-refresh.yml FULL ==="
          cat .github/workflows/d1-refresh.yml
          echo "=== wrangler.jsonc (first 70 lines) ==="
          head -70 wrangler.jsonc
