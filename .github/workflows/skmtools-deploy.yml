name: Skmtools Deploy (bridge)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout skmtools
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/skmtools
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy public --project-name=skmtools --branch=main --commit-dirty=true
      - name: Verify live
        run: |
          sleep 25
          echo "favicon.ico: $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://skmtools.pages.dev/favicon.ico)"
          curl -s --max-time 30 https://skmtools.pages.dev/ | grep -o 'og:site_name[^>]*' | head -2 || echo "og:site_name NOT FOUND"
