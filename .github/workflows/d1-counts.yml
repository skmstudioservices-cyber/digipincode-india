name: D1 Counts (read-only)
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          Q() { npx --yes wrangler@latest d1 execute pincode-india-db --remote --json --command "$1" 2>/dev/null | tail -c 400; }
          echo "pincodes_total:"; Q "SELECT COUNT(*) AS n FROM pincodes;"
          echo "pincodes_with_latlon:"; Q "SELECT COUNT(*) AS n FROM pincodes WHERE lat IS NOT NULL AND lon IS NOT NULL;"
          echo "villages_total:"; Q "SELECT COUNT(*) AS n FROM villages;"
          echo "villages_with_digipin:"; Q "SELECT COUNT(*) AS n FROM villages WHERE digipin IS NOT NULL;"
          echo "digipin_total:"; Q "SELECT COUNT(*) AS n FROM digipin;"
          echo "sample_pincodes:"; Q "SELECT pincode, office_name, lat, lon FROM pincodes WHERE lat IS NOT NULL LIMIT 3;"
