name: D1 Verify Indexes (read-only)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: List all indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute pincode-india-db --remote --command "SELECT name, tbl_name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' ORDER BY tbl_name, name;" --json
          npx --yes wrangler d1 execute pincode-india-db --remote --command "SELECT COUNT(*) AS villages FROM villages; SELECT COUNT(*) AS panchayats FROM lgd_panchayats;" --json
