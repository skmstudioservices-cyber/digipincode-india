name: Network Deploy (fallback CF access)

# Deploys ANY site repo's Cloudflare Pages project using THIS repo's
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets — so individual site
# repos never need their own CF secrets. Fallback path for any site whose own
# deploy workflow lacks credentials.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo to deploy (e.g. Demo, toiletsnearme)'
        required: true
      project_name:
        description: 'Cloudflare Pages project name (e.g. demo)'
        required: true
      dir:
        description: 'Directory to deploy (default .)'
        required: false
        default: '.'
      branch:
        description: 'Branch'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/${{ inputs.target_repo }}
          ref: ${{ inputs.branch }}
          path: site
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd site
          npx --yes wrangler@latest pages deploy "${{ inputs.dir }}" --project-name="${{ inputs.project_name }}" --branch="${{ inputs.branch }}" --commit-dirty=true
      - name: Verify
        run: |
          sleep 20
          echo "${{ inputs.project_name }} home -> $(curl -s -o /dev/null -w '%{http_code}' -m 30 https://${{ inputs.project_name }}.pages.dev/)"
