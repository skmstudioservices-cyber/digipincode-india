name: Network Deploy (fallback CF access)

# Deploys ANY site repo's Cloudflare Pages project using THIS repo's
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets — so individual site
# repos never need their own CF secrets. Fallback path for any site whose own
# deploy workflow lacks credentials.
#
# 21 Oct 2026 FIX: added an optional BUILD step. Astro/Next sites keep SOURCE
# in the repo (no dist/), so deploying the repo root uploaded no index.html and
# the site 404'd (mapsnearme). Set build=true for any built site; the workflow
# then runs `npm run build` and deploys the output dir (default `dist`).

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo to deploy (e.g. Demo, toiletsnearme)'
        required: true
      project_name:
        description: 'Cloudflare Pages project name (e.g. demo)'
        required: true
      dir:
        description: 'Directory to deploy (default .)'
        required: false
        default: '.'
      branch:
        description: 'Branch'
        required: false
        default: 'main'
      build:
        description: 'Run npm build first (true for Astro/Next sites)'
        required: false
        default: 'false'
      build_dir:
        description: 'Build output dir to deploy when build=true (default dist)'
        required: false
        default: 'dist'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/${{ inputs.target_repo }}
          ref: ${{ inputs.branch }}
          path: site
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build (if requested)
        if: ${{ inputs.build == 'true' }}
        run: |
          cd site
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build
          else
            echo "no package.json — skipping build"
          fi
      - name: Pick deploy dir
        id: pick
        run: |
          cd site
          D="${{ inputs.dir }}"
          if [ "${{ inputs.build }}" = "true" ]; then
            if [ -d "${{ inputs.build_dir }}" ]; then D="${{ inputs.build_dir }}"; fi
          fi
          echo "dir=$D" >> $GITHUB_OUTPUT
          echo "Deploying: $D"
          ls -la "$D" | head -20
      - name: Ensure Pages project exists (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create "${{ inputs.project_name }}" --production-branch="${{ inputs.branch }}" || echo "project already exists"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd site
          npx --yes wrangler@latest pages deploy "${{ steps.pick.outputs.dir }}" --project-name="${{ inputs.project_name }}" --branch="${{ inputs.branch }}" --commit-dirty=true
      - name: Verify (home must be 200)
        run: |
          sleep 25
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://${{ inputs.project_name }}.pages.dev/)
          echo "${{ inputs.project_name }} home -> $code"
          if [ "$code" != "200" ]; then echo "::error::root not 200"; exit 1; fi
      - name: Page-test gate (every page: status, title, H1, words, JSON-LD)
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.error
          SITE="https://${{ inputs.project_name }}.pages.dev"; MINW=120
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 skm-test"}),timeout=25)
                  return r.getcode(), r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e: return e.code,""
              except Exception: return 0,""
          c,b=get(SITE+"/sitemap.xml"); urls=re.findall(r"<loc>([^<]+)</loc>", b) if c==200 else [SITE+"/"]
          urls=urls[:40]; bad=[]
          for u in urls:
              code,html=get(u)
              txt=re.sub(r"<script.*?</script>|<style.*?</style>","",html,flags=re.S|re.I)
              words=len(re.sub(r"<[^>]+>"," ",txt).split())
              probs=[]
              if code!=200: probs.append("HTTP %s"%code)
              if not re.search(r"<title>",html,re.I): probs.append("no title")
              if not re.search(r"<h1",html,re.I): probs.append("no h1")
              if words<MINW: probs.append("thin %sw"%words)
              if "application/ld+json" not in html: probs.append("no JSON-LD")
              if probs: bad.append("%s [%s]"%(u,"; ".join(probs)))
          print("PAGE-TEST: %d/%d pass"%(len(urls)-len(bad),len(urls)))
          for x in bad: print("  -",x)
          if bad: raise SystemExit(1)
          PY
