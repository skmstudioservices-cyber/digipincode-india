name: SPOC Deploy

description: Deploy SPOC dashboard (my-dashboard repo) to skm-spoc.pages.dev

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy SPOC to skm-spoc.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "Pulling latest SPOC dashboard from my-dashboard repo..."
          git clone --depth 1 https://github.com/skmstudioservices-cyber/my-dashboard.git /tmp/md
          echo "Deploying to skm-spoc.pages.dev (Cloudflare Pages direct upload)..."
          cd /tmp/md
          npx -y wrangler@3 pages deploy . --project-name=skm-spoc --branch=main --commit-dirty=true 2>&1 | tail -4
          echo "Done: https://skm-spoc.pages.dev"

