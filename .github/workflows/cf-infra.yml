name: CF Infra

# Creates India-closest (apac) D1 databases and KV namespaces with -db / -KV naming.
# STANDING RULE: all databases must be created in India region where available
# (Supabase = Mumbai ap-south-1; D1 = apac hint — India is not offered for D1; KV = global edge).
# Naming rule: every resource name ends with -db (D1) or KV prefix suffix _KV.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'create | cleanup'
        default: 'create'

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create resources
        if: inputs.mode == 'create'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler d1 create pincode-india-db --location-hint apac 2>&1 | tail -5
          npx wrangler d1 create mapsnearme-db --location-hint apac 2>&1 | tail -5
          npx wrangler kv namespace create MAPSNEARME_ADS_KV 2>&1 | tail -5
          npx wrangler kv namespace create SESSION_KV 2>&1 | tail -5
      - name: Cleanup old resources (only after migration verified)
        if: inputs.mode == 'cleanup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Cleanup is executed manually with specific IDs — see run notes"
      - name: List all D1 + KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list
          echo '---KV---'
          npx wrangler kv namespace list
