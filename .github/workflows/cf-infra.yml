name: CF Infra

# Creates India-closest (apac) D1 databases and KV namespaces with -db / -KV naming.
# STANDING RULE: all databases must be created in India region where available
# (Supabase = Mumbai ap-south-1; D1 = apac hint — India is not offered for D1; KV = global edge).
# Naming rule: every resource name ends with -db (D1) or _KV (KV).
# NOTE: old `pincode-india` (wnam) is intentionally NOT deleted here — it serves the live site until the apac DB is fully seeded.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'create | cleanup'
        default: 'create'

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create resources (idempotent)
        if: inputs.mode == 'create'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 create pincode-india-db --location apac || true
          npx --yes wrangler d1 create mapsnearme-db --location apac || true
          npx --yes wrangler kv namespace create MAPSNEARME_ADS_KV || true
          npx --yes wrangler kv namespace create SESSION_KV || true
      - name: Cleanup old (renamed/replaced) resources
        if: inputs.mode == 'cleanup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # old KV namespaces (replaced by *_KV — mapsnearme redeployed 2026-09-16)
          npx --yes wrangler kv namespace delete --namespace-id 712a25b4ffc54a308d305e22be3b658c || true   # SESSION (old)
          npx --yes wrangler kv namespace delete --namespace-id 293bfcfd31c64edab87964ad1de5e27e || true   # MAPSNEARME_ADS (old, empty)
          # old empty D1 (never used; replaced by apac mapsnearme-db)
          npx --yes wrangler d1 delete mapsnearme -y || true
      - name: List all D1 + KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 list
          echo '---KV---'
          npx --yes wrangler kv namespace list
