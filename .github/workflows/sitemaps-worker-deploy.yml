name: Deploy Sitemap Hub

on:
  push:
    paths:
      - 'sitemaps-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy sitemaps worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy -c sitemaps-worker/wrangler.jsonc
      - name: Verify hub
        run: |
          sleep 15
          echo "--- gsc file"; curl -sS -o /tmp/g -w "%{http_code} %{content_type}\n" -m 30 "https://sitemaps.india-in.workers.dev/google89ab3618a1b62b6f.html"; cat /tmp/g; echo
          echo "--- index"; curl -sS -m 30 "https://sitemaps.india-in.workers.dev/" | head -c 200; echo
          for s in toiletsnearme restareanearme karvachauth; do
            echo "--- $s"; curl -sS -o /tmp/x -w "%{http_code} %{content_type}\n" -m 30 -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "https://sitemaps.india-in.workers.dev/$s/sitemap.xml"
            head -c 90 /tmp/x; echo
          done
