name: Niche Rebuild SEO
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/Demo
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Re-deploy each niche with sitemap + robots + 404
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCT=$(curl -s -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          ok=0
          for f in *.html; do
            slug="${f%.html}"
            [ "$slug" = "index" ] && continue
            sub=$(curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$slug" | jq -r '.result.subdomain')
            [ "$sub" = "null" ] && sub="$slug.pages.dev"
            rm -rf /tmp/d && mkdir -p /tmp/d && cp "$f" /tmp/d/index.html && cp -r css js /tmp/d/ 2>/dev/null
            printf 'User-agent: *\nAllow: /\n\nSitemap: https://%s/sitemap.xml\n' "$sub" > /tmp/d/robots.txt
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://%s/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>\n</urlset>\n' "$sub" > /tmp/d/sitemap.xml
            printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Page not found</title></head><body style="font-family:system-ui;padding:40px"><h1>404 — not found</h1><p><a href="/">Go to the finder</a></p></body></html>\n' > /tmp/d/404.html
            if npx --yes wrangler@latest pages deploy /tmp/d --project-name="$slug" --branch=main --commit-dirty=true >/dev/null 2>&1; then
              echo "OK $slug -> $sub"; ok=$((ok+1))
            else echo "FAIL $slug"; fi
          done
          echo "=== rebuilt: $ok ==="
