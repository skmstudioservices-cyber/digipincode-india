name: Deploy Voice Agent (SKM)

on:
  workflow_dispatch:
    inputs:
      proxy_key:
        description: 'PROXY_KEY for skm-voice-agent-proxy (set once; re-run with a new value to rotate)'
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/voice-brain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create skm-voice-agent --production-branch=main || true
      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy . --project-name=skm-voice-agent --branch=main --commit-dirty=true
      - name: Deploy proxy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config worker/wrangler.toml
      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PK: ${{ inputs.proxy_key }}
        run: |
          echo "${CLOUDFLARE_ACCOUNT_ID}" | npx --yes wrangler secret put CF_ACCOUNT_ID --name skm-voice-agent-proxy
          echo "${CLOUDFLARE_API_TOKEN}" | npx --yes wrangler secret put CF_API_TOKEN --name skm-voice-agent-proxy
          if [ -n "${PK}" ]; then printf '%s' "${PK}" | npx --yes wrangler secret put PROXY_KEY --name skm-voice-agent-proxy; fi
      - name: Verify proxy end-to-end
        if: inputs.proxy_key != ''
        env:
          PK: ${{ inputs.proxy_key }}
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            R=$(curl -s -X POST "https://skm-voice-agent-proxy.india-in.workers.dev/chat" \
              -H "Content-Type: application/json" -H "x-proxy-key: ${PK}" \
              -d '{"model":"@cf/meta/llama-3.1-8b-instruct-fp8-fast","messages":[{"role":"user","content":"reply with the single word: ok"}]}')
            echo "attempt $i: $(echo "$R" | head -c 300)"
            if echo "$R" | grep -q response; then echo 'PROXY WORKS'; exit 0; fi
            sleep 20
          done
          echo 'PROXY VERIFY FAILED'; exit 1
      - name: Verify live site is OUR app
        run: |
          sleep 15
          P=$(curl -s https://skm-voice-agent.pages.dev)
          if echo "$P" | grep -q 'Unlock Workspace'; then echo 'PAGES SHOWS FOREIGN LOCK SCREEN'; exit 1; fi
          if echo "$P" | grep -q 'SKM Voice Agent'; then echo 'PAGES OK - our app is live on skm-voice-agent.pages.dev'; else echo 'PAGES MISSING OUR APP (subdomain suffix assigned? check deploy output)'; exit 1; fi
          W=$(curl -s https://skm-voice-agent-proxy.india-in.workers.dev)
          if echo "$W" | grep -q 'Unlock Workspace'; then echo 'WORKER SHOWS FOREIGN LOCK SCREEN'; exit 1; fi
          if echo "$W" | grep -q '__VB_PROXY_KEY__'; then echo 'WORKER KEY NOT INJECTED (placeholder unreplaced)'; exit 1; fi
          if echo "$W" | grep -q 'SKM Voice Agent'; then echo 'WORKER OK - app live with injected key'; else echo 'WORKER MISSING OUR APP'; exit 1; fi
