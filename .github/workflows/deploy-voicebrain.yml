name: Deploy Voice Brain

on:
  workflow_dispatch:
    inputs:
      proxy_key:
        description: 'PROXY_KEY for voice-brain-proxy (set once; re-run with a new value to rotate)'
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/voice-brain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create voice-brain --production-branch=main || true
      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy . --project-name=voice-brain --branch=main --commit-dirty=true
      - name: Deploy proxy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config worker/wrangler.toml
      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PK: ${{ inputs.proxy_key }}
        run: |
          echo "${CLOUDFLARE_ACCOUNT_ID}" | npx --yes wrangler secret put CF_ACCOUNT_ID --name voice-brain-proxy
          echo "${CLOUDFLARE_API_TOKEN}" | npx --yes wrangler secret put CF_API_TOKEN --name voice-brain-proxy
          if [ -n "${PK}" ]; then printf '%s' "${PK}" | npx --yes wrangler secret put PROXY_KEY --name voice-brain-proxy; fi
      - name: Verify proxy end-to-end
        if: inputs.proxy_key != ''
        env:
          PK: ${{ inputs.proxy_key }}
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            R=$(curl -s -X POST "https://voice-brain-proxy.india-in.workers.dev/chat" \
              -H "Content-Type: application/json" -H "x-proxy-key: ${PK}" \
              -d '{"model":"@cf/meta/llama-3.1-8b-instruct-fp8-fast","messages":[{"role":"user","content":"reply with the single word: ok"}]}')
            echo "attempt $i: $(echo "$R" | head -c 300)"
            if echo "$R" | grep -q response; then echo 'PROXY WORKS'; exit 0; fi
            sleep 20
          done
          echo 'PROXY VERIFY FAILED'; exit 1
