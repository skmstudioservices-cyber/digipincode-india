name: Bing Webmaster Pull (daily)
on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pull Bing data
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing-pull.mjs || true
      - name: Shape + summary
        run: |
          node -e "
          const d=require('./bing-data.json');
          const s=d.sites||[];
          console.log('COUNT='+s.length);
          console.log('SAMPLE='+JSON.stringify(s[0]).slice(0,700));
          "
      - uses: actions/upload-artifact@v4
        with: { name: bing-data, path: bing-data.json, retention-days: 7, if-no-files-found: warn }
