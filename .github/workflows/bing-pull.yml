name: Bing Webmaster Pull (daily)

# Pulls Bing Webmaster keyword data (queries, impressions, clicks, position)
# using the BING_WEBMASTER_API_KEY repo secret (Bing has no OAuth).
# Output JSON is uploaded as an artifact; the cron agent folds it into the sheet's Bing tab.
on:
  schedule:
    - cron: '40 1 * * *'   # 07:10 IST
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pull Bing data
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing-pull.mjs || true
      - uses: actions/upload-artifact@v4
        with: { name: bing-data, path: bing-data.json, retention-days: 7, if-no-files-found: warn }
