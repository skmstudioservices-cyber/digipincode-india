name: Bing Webmaster Pull (daily)
on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pull Bing data
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing-pull.mjs || true
      - name: Emit daily series (for DoD / WoW)
        run: |
          node -e "
          const d=require('./bing-data.json'); const s=d.sites||[];
          const cut = Date.now() - 22*86400000;
          for (const x of s) for (const day of (x.daily||[])) {
            const m=/\((\d+)\)/.exec(day.Date||''); if(!m) continue;
            const ts=parseInt(m[1]); if(ts<cut) continue;
            console.log('D|'+(x.site||'')+'|'+new Date(ts).toISOString().slice(0,10)+'|'+(day.Clicks||0)+'|'+(day.Impressions||0));
          }
          "
      - uses: actions/upload-artifact@v4
        with: { name: bing-data, path: bing-data.json, retention-days: 7, if-no-files-found: warn }
