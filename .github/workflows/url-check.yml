name: URL Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl checks
        run: |
          set +e
          for url in \
            "https://digipincode.pages.dev/" \
            "https://1ac538f3.digipincode.pages.dev/" \
            "https://094bd5a8.digipincode.pages.dev/" \
            "https://dda62097.digipincode.pages.dev/" \
            "https://digipincode.pages.dev/robots.txt" \
            "https://1ac538f3.digipincode.pages.dev/robots.txt"; do
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "$url")
            size=$(wc -c < /tmp/b)
            echo "=== $url -> HTTP $code (${size}b)"
          done
