name: URL Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl checks
        run: |
          set +e
          echo "=== _routes.json (from repo build earlier) ==="
          curl -s "https://digipincode.pages.dev/_routes.json" | head -c 400; echo
          for url in \
            "https://digipincode.pages.dev/" \
            "https://72b19271.digipincode.pages.dev/" \
            "https://digipincode.pages.dev/robots.txt"; do
            echo "=== $url"
            curl -sD - -o /dev/null --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "$url" | head -14
          done
