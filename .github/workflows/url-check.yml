name: URL Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots + sitemap checks
        run: |
          set +e
          check() {
            host=$1
            for path in robots.txt sitemap.xml; do
              code=$(curl -s -o /tmp/f -w "%{http_code}" --max-time 40 -A "Mozilla/5.0 (compatible; AhrefsBot/7.0; +http://ahrefs.com/robot/)" "https://$host/$path")
              size=$(wc -c < /tmp/f)
              ctype=$(curl -s -o /dev/null -w "%{content_type}" --max-time 40 "https://$host/$path")
              echo "=== https://$host/$path -> HTTP $code | ${size}b | $ctype"
              head -c 220 /tmp/f | tr '\n' ' '; echo
            done
            code=$(curl -s -o /tmp/f -w "%{http_code}" --max-time 40 -A "Mozilla/5.0 (Linux; Android 10)" "https://$host/")
            echo "=== https://$host/ -> HTTP $code ($(wc -c < /tmp/f)b)"
          }
          check digipincode.india-in.workers.dev
          check digipincode.pages.dev
          check digitalpincode.blogspot.com
