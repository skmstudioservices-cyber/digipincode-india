name: URL Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl checks
        run: |
          set +e
          for url in \
            "https://digipincode.pages.dev/" \
            "https://digipincode.pages.dev/robots.txt" \
            "https://digipincode.pages.dev/sitemap.xml" \
            "https://digipincode.pages.dev/digipin/" \
            "https://1204f199.digipincode.pages.dev/" \
            "https://digipincode.pages.dev/arunachal-pradesh/district-papum-pare/tehsil-banderdewa-circle/village-c-f-colony/pincode-791123" \
            "https://digipincode.india-in.workers.dev/"; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "$url")
            size=$(wc -c < /tmp/body)
            echo "=== $url -> HTTP $code (${size} bytes)"
            head -c 160 /tmp/body | tr -d '\n'
            echo
          done
