name: UI Check (Playwright screenshots)

# Renders the key sites at mobile + desktop viewports and uploads screenshots,
# so we can SEE map/text/visibility issues (static HTML checks can't catch these).
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated URLs (optional)"
        required: false
        default: ""

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        run: npm i playwright@latest && npx playwright install --with-deps chromium
      - name: Screenshot
        run: |
          mkdir -p shots
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const inp = process.env.INPUT_URLS || '';
          const urls = (inp ? inp.split(',') : [
            'https://demo-vmv.pages.dev/atmsnearme/',
            'https://toiletsnearme.pages.dev/',
            'https://restareanearme.pages.dev/',
            'https://cngpumpsnearme.pages.dev/',
            'https://evchargersnearme.pages.dev/',
            'https://digipincode.india-in.workers.dev/'
          ]).map(s=>s.trim()).filter(Boolean);
          const sizes = [[360,800,'mobile'],[1280,900,'desktop']];
          const b = await chromium.launch();
          for (const u of urls) {
            for (const [w,h,tag] of sizes) {
              const p = await b.newPage({ viewport:{width:w,height:h}, deviceScaleFactor:1 });
              const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
              p.on('console',m=>{ if(m.type()==='error') errs.push('console:'+m.text().slice(0,120)); });
              try { await p.goto(u,{waitUntil:'networkidle',timeout:60000}); } catch(e){ errs.push('goto:'+String(e).slice(0,80)); }
              await p.waitForTimeout(3000);
              const name = u.replace(/[^a-z0-9]/gi,'_').slice(-60)+'_'+tag+'.png';
              await p.screenshot({ path:'shots/'+name });
              console.log('SHOT', name, '| errors:', errs.join(' || ') || 'none');
              await p.close();
            }
          }
          await b.close();
          JS
          node shot.mjs
        env:
          INPUT_URLS: ${{ inputs.urls }}
      - name: Lighthouse mobile (key sites)
        run: |
          npm i -g lighthouse
          for u in https://toiletsnearme.pages.dev/ https://restareanearme.pages.dev/ https://digipincode.india-in.workers.dev/; do
            lighthouse "$u" --quiet --chrome-flags="--headless --no-sandbox" --form-factor=mobile --only-categories=performance,accessibility,seo --output=json --output-path="shots/lh_$(echo $u|tr -c 'a-z0-9' '_').json" || true
          done
          echo "Lighthouse done"
      - uses: actions/upload-artifact@v4
        with: { name: ui-shots, path: shots/, retention-days: 3 }
