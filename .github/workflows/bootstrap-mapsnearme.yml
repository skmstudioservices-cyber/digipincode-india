name: Bootstrap deploy mapsnearme (one-time)

# mapsnearme repo public hai isliye is repo ke CF secrets se uska pehla deploy ho sakta hai.
# Jab tak mapsnearme repo mein apne CF secrets nahi hain, tab tak ye workflow use hota hai.

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-mapsnearme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout mapsnearme (public repo)
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/mapsnearme
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages (mapsnearme)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mapsnearme --branch=main --commit-dirty=true
