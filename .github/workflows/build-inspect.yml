name: Build Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Inspect dist
        run: |
          echo "=== dist file count: $(find dist -type f | wc -l)"
          find dist -type f | sort | head -40
          echo "=== _worker.js present: $(test -f dist/_worker.js && echo YES || echo NO)"
          echo "=== _routes.json: $(cat dist/_routes.json 2>/dev/null || echo MISSING)"
          echo "=== index.html present: $(test -f dist/index.html && echo YES || echo NO)"
          echo "=== astro config output mode:"
          grep -n "output" astro.config.mjs | head -5
