name: Secrets Audit (presence only)

# Two answers in one run:
#   1. The ACTUAL names of every secret stored on this repo (names only, never values)
#   2. Whether the names the workflows ask for resolve
# Uses GH_PAT to list, because the default token cannot read secrets.

on:
  workflow_dispatch:
  push:
    paths:
      - 'secrets-audit/run.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: List stored secret names
        env:
          TOK: ${{ secrets.GH_PAT }}
        run: |
          set +e
          echo "=== SECRETS STORED ON THIS REPO (names only) ==="
          curl -s -H "Authorization: Bearer $TOK" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets?per_page=100" \
            -o /tmp/s.json
          cnt=$(jq -r '.total_count // 0' /tmp/s.json)
          echo "total: $cnt"
          jq -r '.secrets[]?.name' /tmp/s.json | sort | sed 's/^/  - /'

      - name: Does the name the workflow asks for resolve?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chk () { if [ -n "$2" ]; then printf '%-32s PRESENT\n' "$1"; else printf '%-32s EMPTY\n' "$1"; fi; }
          echo "=== name resolution ==="
          chk CLOUDFLARE_API_TOKEN            "$CLOUDFLARE_API_TOKEN"
          chk CLOUDFLARE_ACCOUNT_ID           "$CLOUDFLARE_ACCOUNT_ID"
          chk BING_WEBMASTER_API_KEY          "$BING_WEBMASTER_API_KEY"
          chk GH_PAT                          "$GH_PAT"
          echo "-- supabase candidates --"
          chk SUPABASE_ANON_KEY               "$SUPABASE_ANON_KEY"
          chk SUPABASE_KEY                    "$SUPABASE_KEY"
          chk SUPABASE_PUBLISHABLE_KEY        "$SUPABASE_PUBLISHABLE_KEY"
          chk SUPABASE_ANON                   "$SUPABASE_ANON"
          chk SUPABASE_URL                    "$SUPABASE_URL"
          chk NEXT_PUBLIC_SUPABASE_ANON_KEY   "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Does the Supabase key actually authenticate?
        env:
          K: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          echo "=== live check against the Supabase REST endpoint ==="
          # Print only the HTTP status and the key's shape prefix. Never the key.
          shape="unknown"
          case "$K" in
            sb_publishable_*) shape="modern publishable key (sb_publishable_...)" ;;
            eyJ*)             shape="legacy JWT anon key (eyJ...)" ;;
            "")               shape="empty" ;;
            *)                shape="unrecognised prefix" ;;
          esac
          echo "key shape: $shape"
          # Test the three ways a key can be sent — a publishable key is NOT a JWT,
          # so sending it as "Authorization: Bearer" makes the API answer 401 even
          # when the key is correct. This separates "wrong key" from "wrong header".
          for ref in timnrnmmmmuqmcnuaend hfmkznptehdhtgsuwzri; do
            # /rest/v1/ root is NOT a data endpoint and answers 401 even for a good
            # key. /auth/v1/health is the reliable reachability+auth probe.
            h=$(curl -s -o /tmp/hh.json -w '%{http_code}' -m 20 -H "apikey: $K" "https://$ref.supabase.co/auth/v1/health")
            echo "  $ref auth/v1/health -> HTTP $h  body=$(head -c 80 /tmp/hh.json 2>/dev/null)"
            a=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -H "apikey: $K" "https://$ref.supabase.co/rest/v1/")
            b=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -H "Authorization: Bearer $K" "https://$ref.supabase.co/rest/v1/")
            c=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -H "apikey: $K" -H "Authorization: Bearer $K" "https://$ref.supabase.co/rest/v1/")
            echo "  $ref -> apikey-only=$a  bearer-only=$b  both=$c"
          done
          echo "  (200/400/404 = key accepted by the API; 401 = key rejected; 5xx = project paused or down)"

      - name: Which project does the key belong to?
        env:
          K: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          # A Supabase JWT carries a "ref" claim naming its project. Printing ONLY
          # that claim and the role identifies the project without exposing the key.
          payload=$(printf '%s' "$K" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in 2) payload="$payload==";; 3) payload="$payload=";; esac
          dec=$(printf '%s' "$payload" | base64 -d 2>/dev/null)
          if [ -z "$dec" ]; then echo "not a JWT — cannot read a ref claim"; exit 0; fi
          echo "key ref claim : $(printf '%s' "$dec" | jq -r '.ref // "none"')"
          echo "key role claim: $(printf '%s' "$dec" | jq -r '.role // "none"')"
          echo "key issued at : $(printf '%s' "$dec" | jq -r '.iat // "none"')"
          echo "key expires   : $(printf '%s' "$dec" | jq -r '.exp // "none"')"
          echo "expected ref  : timnrnmmmmuqmcnuaend"
