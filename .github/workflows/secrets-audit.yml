name: Secrets Audit (presence only)

# Reports whether each secret the workflows actually reference is set.
# Prints ONLY "present" / "empty". Never prints a value.

on:
  workflow_dispatch:
  push:
    paths:
      - 'secrets-audit/run.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Presence check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chk () { if [ -n "$2" ]; then printf '%-28s PRESENT\n' "$1"; else printf '%-28s EMPTY\n' "$1"; fi; }
          echo "=== secrets referenced by real workflows ==="
          chk CLOUDFLARE_API_TOKEN     "$CLOUDFLARE_API_TOKEN"
          chk CLOUDFLARE_ACCOUNT_ID    "$CLOUDFLARE_ACCOUNT_ID"
          chk BING_WEBMASTER_API_KEY   "$BING_WEBMASTER_API_KEY"
          chk SUPABASE_ANON_KEY        "$SUPABASE_ANON_KEY"
          chk GH_PAT                   "$GH_PAT"
          echo
          echo "GITHUB_TOKEN is automatic — never needs adding."
