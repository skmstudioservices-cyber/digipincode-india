name: Bing submit (sitemap + URL batch)

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "site URL, or all"
        required: false
        default: "https://toiletsnearme.pages.dev/"
      max:
        description: "max URLs per site"
        default: "100"

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Submit one site
        if: github.event.inputs.site != 'all'
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing-submit.mjs "${{ github.event.inputs.site || 'https://toiletsnearme.pages.dev/' }}" "${{ github.event.inputs.max || '100' }}"

      - name: Submit every site
        if: github.event.inputs.site == 'all'
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          MAX: ${{ github.event.inputs.max || '100' }}
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const sites = JSON.parse(fs.readFileSync("bing-sites.json", "utf8")).sites;
          console.log("sites to submit:", sites.length);
          fs.writeFileSync("/tmp/sites.txt", sites.join("\n"));
          '
          ok=0; fail=0
          while read -r S; do
            [ -z "$S" ] && continue
            echo "===== $S"
            if node scripts/bing-submit.mjs "$S" "$MAX"; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done < /tmp/sites.txt
          echo "SUMMARY ok=$ok fail=$fail"
