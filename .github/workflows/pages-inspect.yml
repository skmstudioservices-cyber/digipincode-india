name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify map sites + data
        run: |
          set -e
          echo "waiting 240s for data pipelines + CF deploys..."
          sleep 240
          for s in toiletsnearme cngpumpsnearme evchargersnearme; do
            code=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/)
            hasmap=$(grep -c "leaflet" /tmp/i.html || true)
            mcode=$(curl -sL -o /tmp/m.json -w "%{http_code}" --max-time 20 https://$s.pages.dev/data/manifest.json)
            if [ "$mcode" = "200" ]; then
              total=$(python3 -c "import json;d=json.load(open('/tmp/m.json'));print(sum(c['n'] for c in d['cities'].values()), 'POIs in', len(d['cities']), 'cities, generated', d.get('generated'))")
            else total="manifest HTTP $mcode (pipeline may still be running)"; fi
            echo "$s | site HTTP $code | leaflet refs: $hasmap | data: $total"
          done

