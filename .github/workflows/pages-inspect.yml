name: Pages Inspect
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Branding audit - 4 sites
        run: |
          set -u
          CB=$(date +%s)
          FAIL=0
          REPORT="audit-$(date -u +%Y%m%dT%H%M%SZ).txt"

          audit_site () {
            NAME="$1"; URL="$2"
            echo "===== SITE: $NAME ($URL) ====="
            H=$(curl -sL --max-time 30 "$URL/?cb=$CB")
            if [ -z "$H" ]; then
              echo "$NAME | homepage | UNREACHABLE | FAIL"
              FAIL=1
              return
            fi
            for M in 'title' 'og:site_name' 'theme-color'; do
              if echo "$H" | grep -qi "$M"; then
                echo "$NAME | meta $M | PASS"
              else
                echo "$NAME | meta $M | FAIL"
                FAIL=1
              fi
            done
            if echo "$H" | grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"WebSite"'; then
              echo "$NAME | WebSite JSON-LD | PASS"
            else
              echo "$NAME | WebSite JSON-LD | FAIL"
              FAIL=1
            fi
            for A in favicon.svg favicon.ico apple-touch-icon.png og-image.png; do
              C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/$A?cb=$CB")
              if [ "$C" = "200" ]; then
                echo "$NAME | asset /$A | 200 PASS"
              else
                echo "$NAME | asset /$A | $C FAIL"
                FAIL=1
              fi
            done
          }

          {
          audit_site digipincode-workers https://digipincode.india-in.workers.dev
          audit_site digipincode-pages https://digipincode.pages.dev
          audit_site mapsnearme-pages https://mapsnearme.pages.dev
          audit_site examstatus-workers https://examstatus.india-in.workers.dev

          echo "===== canonical check: digipincode.pages.dev ====="
          HP=$(curl -sL --max-time 30 "https://digipincode.pages.dev/?cb=$CB")
          CANON=$(echo "$HP" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)
          echo "canonical tag: ${CANON:-NONE}"
          if echo "$CANON" | grep -q 'digipincode\.india-in\.workers\.dev'; then
            echo "digipincode-pages | canonical -> workers.dev | PASS"
          else
            echo "digipincode-pages | canonical -> workers.dev | FAIL"
            FAIL=1
          fi

          echo "===== privacy-policy Ahrefs disclosure (digipincode) ====="
          PP=$(curl -sL --max-time 30 "https://digipincode.india-in.workers.dev/privacy-policy?cb=$CB")
          if [ -z "$PP" ]; then
            echo "digipincode-workers | privacy-policy | UNREACHABLE | FAIL"
            FAIL=1
          elif echo "$PP" | grep -qi ahrefs; then
            echo "digipincode-workers | privacy-policy Ahrefs disclosure | PASS"
          else
            echo "digipincode-workers | privacy-policy Ahrefs disclosure | FAIL"
            FAIL=1
          fi

          echo "===== SUMMARY fail_flag=$FAIL ====="
          } 2>&1 | tee "$REPORT"

          mkdir -p .branding-audit
          cp "$REPORT" .branding-audit/last-run.txt
          git config user.name "skm-ops-bot"
          git config user.email "skmstudio.services@gmail.com"
          git checkout -b branding-audit-reports || git checkout branding-audit-reports
          git add .branding-audit
          git commit -m "branding audit report $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin branding-audit-reports -f || echo "push failed (report still in logs)"

          grep -q 'fail_flag=0' "$REPORT" && exit 0 || exit 1
