name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: wait for pages build then check
        run: |
          sleep 90
          for U in "floodsnearme.pages.dev/about/" "floodsnearme.pages.dev/privacy/" "floodsnearme.pages.dev/terms/" "floodsnearme.pages.dev/contact/" "floodsnearme.pages.dev/design-preview/" "floodsnearme.pages.dev/favicon.svg" "floodsnearme.pages.dev/logo.svg" "floodsnearme.pages.dev/"; do
            CODE=$(curl -s -L -o /tmp/p.html -w "%{http_code}" --max-time 20 "https://$U")
            TAG=$(grep -c "GlkDu5ZL" /tmp/p.html 2>/dev/null || true)
            echo "RECHECK $U -> $CODE TAG=$TAG"
          done
