name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Final map data verify
        run: |
          set -e
          sleep 90
          for s in toiletsnearme cngpumpsnearme evchargersnearme; do
            code=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/)
            mcode=$(curl -sL -o /tmp/m.json -w "%{http_code}" --max-time 20 https://$s.pages.dev/data/manifest.json)
            info=$(python3 -c "import json;d=json.load(open('/tmp/m.json'));cs=d['cities'];print(sum(c['n'] for c in cs.values()),'POIs /',len(cs),'cities /',d.get('generated'))" 2>/dev/null || echo "manifest $mcode")
            echo "$s | HTTP $code | $info"
          done

