name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Final data check
        run: |
          set -e
          sleep 75
          for s in toiletsnearme cngpumpsnearme evchargersnearme; do
            curl -sL --max-time 20 https://$s.pages.dev/data/manifest.json -o /tmp/m.json
            python3 -c "import json;d=json.load(open('/tmp/m.json'));cs=d['cities'];print('$s:',sum(c['n'] for c in cs.values()),'POIs in',len(cs),'cities (new:',','.join(sorted(set(cs)-{'delhi','mumbai','bengaluru','hyderabad','chennai','kolkata','pune','ahmedabad','jaipur','lucknow','surat','indore'})),')')" 2>/dev/null || echo "$s: manifest not updated yet"
          done

