name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fix dashboardmapsnearme build config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== PATCH dashboardmapsnearme build_config ==="
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"build_config": {"build_command": "npm run build", "destination_dir": "dist"}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dashboardmapsnearme" \
            | jq '{success, build_config: .result.build_config, errors}'
          echo "=== TRIGGER new dashboardmapsnearme deployment ==="
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dashboardmapsnearme/deployments" \
            | jq '{success, id: .result.id[0:8], errors}'
          sleep 90
          echo "=== NEWEST deployment status ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dashboardmapsnearme/deployments?per_page=1" \
            | jq '[.result[] | {id: .id[0:8], created: .created_on, stage: .latest_stage.name, status: .latest_stage.status}]'
          echo "=== live check ==="
          for u in "https://dashboardmapsnearme.pages.dev/" "https://dashboardmapsnearme.pages.dev/login"; do
            code=$(curl -s -o /tmp/f -w "%{http_code}" --max-time 25 -L -A "Mozilla/5.0 (Linux; Android 10)" "$u")
            echo "$u -> HTTP $code ($(wc -c < /tmp/f)b)"
          done
