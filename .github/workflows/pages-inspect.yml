name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: checks
        run: |
          set -x
          for n in floodsnearme recentfloodsnearme flashfloodsnearme floods-near-me floodalertsnearme asiangamesmedaltally2026; do
            getent hosts "$n.pages.dev" >/dev/null && echo "DNS $n TAKEN" || echo "DNS $n AVAILABLE"
          done
          echo "=== WIKIPEDIA TEST ==="
          curl -s --max-time 20 "https://en.wikipedia.org/w/api.php?action=parse&page=2026_Asian_Games_medal_table&prop=text&format=json" -o /tmp/wt.json
          python3 - <<'PY'
          import json, re, html as H
          try:
              d = json.load(open('/tmp/wt.json'))
              if 'error' in d:
                  print('WIKI_ERROR:', d['error'].get('info'))
              else:
                  t = d['parse']['text']['*']
                  rows = re.findall(r'<tr>(.*?)</tr>', t, re.S)
                  print('WIKI_OK title:', d['parse']['title'], 'rows:', len(rows))
                  for r in rows[1:6]:
                      cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)
                      clean = [re.sub(r'<[^>]+>', '', c).replace(' ',' ').strip() for c in cells]
                      print('ROW:', clean[:6])
          except Exception as e:
              print('WIKI_FAIL', e)
          PY
          echo "=== GDACS TEST ==="
          curl -s --max-time 25 "https://www.gdacs.org/xml/rss.xml" -o /tmp/gdacs.xml
          python3 - <<'PY'
          import re
          t = open('/tmp/gdacs.xml', encoding='utf-8', errors='ignore').read()
          items = re.findall(r'<item>(.*?)</item>', t, re.S)
          print('GDACS items:', len(items))
          fl = [i for i in items if 'lood' in i]
          print('flood items:', len(fl))
          for i in (fl or items)[:4]:
              title = re.search(r'<title>(.*?)</title>', i, re.S)
              print('GD:', title.group(1)[:120] if title else '?')
          PY
