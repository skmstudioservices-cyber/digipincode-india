name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify safealleys + spoc
        run: |
          set -e
          sleep 30
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/b.html -w "%{http_code}" --max-time 20 https://safealleys.pages.dev/)
            echo "safealleys try $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 40
          done
          title=$(grep -o "<title>[^<]*" /tmp/b.html | head -1 | cut -c8-60)
          echo "title: $title"
          code=$(curl -s -o /tmp/d.html -w "%{http_code}" --max-time 20 https://skm-spoc.pages.dev/)
          echo "spoc dashboard: HTTP $code"
          grep -c "safealleys" /tmp/d.html || echo "0"

