name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll safealleys app UI
        run: |
          set -e
          for i in $(seq 1 8); do
            h=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 20 "https://safealleys.pages.dev/")
            ab=$(curl -sL -o /tmp/a.html -w "%{http_code}" --max-time 20 "https://safealleys.pages.dev/about.html")
            d=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "https://safealleys.pages.dev/sw.js")
            dock=$(grep -c "report-fab" /tmp/i.html || true)
            about=$(grep -c "page-main" /tmp/a.html || true)
            echo "check $i: home $h dock $dock | about $ab pagemain $about | sw $d"
            if [ "$h" = "200" ] && [ "$ab" = "200" ] && [ "$dock" -ge 1 ] && [ "$about" -ge 1 ] && [ "$d" = "200" ]; then echo "APP UI LIVE"; exit 0; fi
            sleep 30
          done
          echo "STILL NOT LIVE"

