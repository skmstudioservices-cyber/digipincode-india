name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: State check
        run: |
          set -e
          echo "===== GIT LOG ====="; git log --oneline -10
          echo "===== SEG5 BLOCK ====="; sed -n '60,95p' src/pages/'[...path]'.astro
          echo "===== grep subSlug ====="; grep -n "subSlug" src/pages/'[...path]'.astro | head -5
          echo "===== grep collecting ====="; grep -rn "Collecting from public" src/ public/ | head -5
          echo "===== db.ts check ====="; grep -n "sub_district_slug" src/lib/db.ts | head -3

