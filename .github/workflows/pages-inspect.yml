name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify both UIs (follow redirects)
        run: |
          set -e
          echo "== classic (/) =="
          curl -sL -o /tmp/a.html -w "HTTP %{http_code}\n" --max-time 20 https://my-dashboard-2av.pages.dev/
          grep -o "<title>[^<]*" /tmp/a.html
          echo "zenith switch links: $(grep -c 'zenith.html' /tmp/a.html)"
          echo "== zenith (/zenith) =="
          curl -sL -o /tmp/b.html -w "HTTP %{http_code}\n" --max-time 20 https://my-dashboard-2av.pages.dev/zenith
          grep -o "<title>[^<]*" /tmp/b.html
          echo "comments engine: $(grep -c 'spoc_comments_v1' /tmp/b.html)"
          echo "theme toggle: $(grep -c 'cycleTheme' /tmp/b.html)"
          echo "robots: $(curl -s --max-time 10 https://my-dashboard-2av.pages.dev/robots.txt | head -2 | tr '\n' ' ')"

