name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          sleep 120
          TS=$(date +%s)
          C1=$(curl -s -o /tmp/d.html -w "%{http_code}" --max-time 25 "https://my-dashboard-2av.pages.dev/?t=$TS")
          G1=$(grep -c "s-analytics" /tmp/d.html || true)
          G2=$(grep -c "GA_GLOSSARY" /tmp/d.html || true)
          C2=$(curl -s -o /tmp/g.json -w "%{http_code}" --max-time 25 "https://my-dashboard-2av.pages.dev/ga-data.json?t=$TS")
          P=$(python3 -c "import json;print(len(json.load(open('/tmp/g.json'))['properties']))" 2>/dev/null || echo 0)
          echo "DASH home=$C1 section=$G1 glossary=$G2 gadata=$C2 props=$P"
