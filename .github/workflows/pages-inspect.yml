name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { path: dpc }
      - name: Print head sections
        run: |
          echo "########## digipincode Base.astro"
          python3 - <<'PY'
          import re
          t = open('dpc/src/layouts/Base.astro').read()
          m = re.search(r'<head[ >]', t)
          print(t[m.start():m.start()+2600] if m else t[:2000])
          PY
          echo "########## canonical logic"
          grep -n "canonical" dpc/src/layouts/Base.astro | head -10
