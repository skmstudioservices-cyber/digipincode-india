name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Old sites tags + corrected tag live check
        run: |
          set -e
          T="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nI"
          echo "--- OLD VERIFIED SITES: their live GSC meta tags ---"
          for s in digipincode.pages.dev digipincode.india-in.workers.dev skmtools.pages.dev mapsnearme.pages.dev examstatus.india-in.workers.dev karvachauth.india-in.workers.dev; do
            tag=$(curl -sL --max-time 20 "https://$s/" | grep -o 'google-site-verification" content="[^"]*"' || echo NONE)
            echo "$s -> $tag"
          done
          echo "--- NEW TAG LIVE CHECK (4 updated sites) ---"
          for i in $(seq 1 10); do
            out=""; allok=1
            for s in toiletsnearme cngpumpsnearme evchargersnearme restareanearme; do
              tag=$(curl -sL --max-time 15 "https://$s.pages.dev/?cb=$RANDOM$i" | grep -c "$T" || true)
              out="$out $s=$tag"
              [ "$tag" -lt 1 ] && allok=0
            done
            echo "check $i:$out"
            [ "$allok" = "1" ] && { echo "ALL 4 CORRECTED TAGS LIVE"; exit 0; }
            sleep 30
          done
          echo "STILL NOT ALL LIVE"

