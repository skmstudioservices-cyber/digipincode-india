name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check UGC NET page (follow redirects)
        run: |
          echo "=== redirect target ==="
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" --max-time 25 "https://examstatus.india-in.workers.dev/ugc-net-june-2026-result"
          CODE=$(curl -s -L -o /tmp/u.html -w "%{http_code}" --max-time 30 "https://examstatus.india-in.workers.dev/ugc-net-june-2026-result")
          echo "UGC_FINAL_STATUS=$CODE"
          if [ "$CODE" = "200" ]; then
            grep -c "UGC NET June 2026 Result" /tmp/u.html | sed 's/^/TITLE_HITS=/'
            grep -c "Last updated: 26 September 2026" /tmp/u.html | sed 's/^/STAMP_HITS=/'
            echo "PAGE IS LIVE - no deploy needed"; exit 0
          fi
          echo "not live - building deploy"
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/examstatus
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -2
          npm run build 2>&1 | tail -12
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tail -8
      - name: Verify
        run: |
          sleep 20
          CODE=$(curl -s -L -o /tmp/u2.html -w "%{http_code}" --max-time 30 "https://examstatus.india-in.workers.dev/ugc-net-june-2026-result")
          echo "UGC_AFTER_DEPLOY=$CODE"
          grep -c "UGC NET June 2026 Result" /tmp/u2.html | sed 's/^/TITLE_HITS=/' || true
          curl -s --max-time 25 "https://examstatus.india-in.workers.dev/sitemap-index.xml" | grep -c "ugc-net" | sed 's/^/SITEMAP_HAS_UGC=/' || echo "SITEMAP_HAS_UGC=0"
