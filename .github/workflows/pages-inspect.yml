name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check UGC NET page
        run: |
          CODE=$(curl -s -o /tmp/u.html -w "%{http_code}" --max-time 25 "https://examstatus.india-in.workers.dev/ugc-net-june-2026-result")
          echo "UGC_PAGE_STATUS=$CODE"
          if [ "$CODE" = "200" ]; then echo "already live"; exit 0; fi
          echo "not live - deploying..."
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/examstatus
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -2
          npm run build 2>&1 | tail -15
          ls dist/_worker.js/ | head -3
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tail -8
      - name: Verify
        run: |
          sleep 20
          CODE=$(curl -s -o /tmp/u2.html -w "%{http_code}" --max-time 25 "https://examstatus.india-in.workers.dev/ugc-net-june-2026-result")
          echo "UGC_AFTER_DEPLOY=$CODE"
          grep -o "UGC NET June 2026 Result" /tmp/u2.html | head -1 || true
          curl -s -o /dev/null -w "sitemap -> %{http_code}\n" --max-time 25 "https://examstatus.india-in.workers.dev/sitemap-index.xml"
