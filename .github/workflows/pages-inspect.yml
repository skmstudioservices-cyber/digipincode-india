name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: safealleys rename
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, time, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          # 1) create safealleys (no hyphen - the plan's target name)
          code, d = api(f"/accounts/{ACC}/pages/projects", "POST", {
              "name": "safealleys", "production_branch": "main",
              "source": {"type": "github", "config": {"owner": "skmstudioservices-cyber", "repo_name": "Safe-Alleys",
                  "production_branch": "main", "deployments_enabled": True}}})
          sub = ((d.get("result") or {}).get("subdomain")) or ""
          if code in (200, 201) and sub == "safealleys.pages.dev":
              print("CREATED safealleys ->", sub)
              api(f"/accounts/{ACC}/pages/projects/safealleys/deployments", "POST", {})
              time.sleep(50)
              for i in range(8):
                  code, d = api(f"/accounts/{ACC}/pages/projects/safealleys/deployments")
                  deps = d.get("result") or []
                  if deps and deps[0].get("latest_stage", {}).get("status") in ("success", "failure"):
                      print("build:", deps[0].get("latest_stage", {}).get("status")); break
                  time.sleep(15)
              time.sleep(30)
              try:
                  r = urllib.request.urlopen("https://safealleys.pages.dev/", timeout=15)
                  b = r.read().decode()
                  print("LIVE: HTTP", r.status, "|", b[b.find("<title>")+7:b.find("</title>")][:40])
              except Exception as e:
                  print("live (may be DNS warmup):", type(e).__name__, str(e)[:80])
          elif code in (200, 201):
              api(f"/accounts/{ACC}/pages/projects/safealleys", "DELETE")
              print("NAME TAKEN (suffix", sub, ") - deleted, report to user")
          else:
              print("FAIL:", code, json.dumps(d.get("errors"))[:200])

          # 2) delete the hyphenated one from earlier
          code, d = api(f"/accounts/{ACC}/pages/projects/safe-alleys", "DELETE")
          print("DELETE safe-alleys (old):", code, "| success:", d.get("success"))
          EOF

