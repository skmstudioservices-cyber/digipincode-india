name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/karvachauth
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build karvachauth with GA tag
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -1
          node generate.js 2>&1 | tail -2
          grep -o "G-BFN01W2RX9" dist/index.html | head -1 && echo "TAG_IN_BUILD"
      - name: Deploy karvachauth pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages deploy dist --project-name=karvachauth --branch=main --commit-dirty=true 2>&1 | tail -3
      - name: Verify all GA tags live
        run: |
          sleep 200
          TS=$(date +%s)
          declare -A S=( ["https://toiletsnearme.pages.dev/"]="G-D74LPRXWDW" ["https://cngpumpsnearme.pages.dev/"]="G-0M6041TYXM" ["https://evchargersnearme.pages.dev/"]="G-ZE1GR23S8E" ["https://restareanearme.pages.dev/"]="G-0X9R1NP7T0" ["https://bloodbanksnearme.pages.dev/"]="G-2NK1PGYMJ9" ["https://airqualitynearme.pages.dev/"]="G-2MHNZEB6CH" ["https://earthquakenearme.pages.dev/"]="G-EV785X26ZR" ["https://safealleys.pages.dev/"]="G-GLNKRTPSC1" ["https://mapsnearme.pages.dev/"]="G-NH42KZNW9F" ["https://karvachauth.pages.dev/"]="G-BFN01W2RX9" )
          for U in "${!S[@]}"; do
            G="${S[$U]}"
            CODE=$(curl -s -L -o /tmp/v.html -w "%{http_code}" --max-time 25 "$U?v=$TS" || echo 000)
            TAG=$(grep -c "$G" /tmp/v.html 2>/dev/null || true)
            echo "TAGLIVE $U -> $CODE TAG=$TAG"
          done
