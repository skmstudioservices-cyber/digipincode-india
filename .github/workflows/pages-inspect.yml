name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect skm-spoc to my-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, time, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          # connect skm-spoc to my-dashboard repo (git source -> push = deploy)
          code, d = api(f"/accounts/{ACC}/pages/projects/skm-spoc", "PATCH", {
              "source": {"type": "github", "config": {
                  "owner": "skmstudioservices-cyber",
                  "repo_name": "my-dashboard",
                  "production_branch": "main",
                  "deployments_enabled": True}}})
          src = ((d.get("result") or {}).get("source") or {}).get("config") or {}
          print("PATCH skm-spoc:", code, "| repo:", src.get("repo_name"), "| branch:", src.get("production_branch"))

          # wait for first deploy, then verify live
          for i in range(10):
              time.sleep(30)
              code, d = api(f"/accounts/{ACC}/pages/projects/skm-spoc/deployments")
              deps = d.get("result") or []
              if deps:
                  latest = deps[0]
                  print(f"deploy[{i}]:", latest.get("latest_stage", {}).get("name"), latest.get("latest_stage", {}).get("status"), "| alia:", (latest.get("aliases") or [""])[0])
                  if latest.get("latest_stage", {}).get("status") == "success":
                      try:
                          body = urllib.request.urlopen("https://skm-spoc.pages.dev/", timeout=15).read().decode()
                          print("LIVE HTTP OK | title:", body[body.find("<title>"):body.find("</title>")][:80])
                          print("has SPOC:", "SKM SPOC" in body, "| noindex:", "noindex" in body)
                      except Exception as e:
                          print("live check:", type(e).__name__, str(e)[:100])
                      break
          EOF

