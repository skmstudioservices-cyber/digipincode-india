name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CF pages check/create
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          for name in ["dashboard", "skm-spoc", "mydashboard", "dashboardmapsnearme"]:
              code, d = api(f"/accounts/{ACC}/pages/projects/{name}")
              res = d.get("result") or {}
              err = ""
              if code != 200:
                  errs = d.get("errors") or []
                  err = (str(errs[0].get("code", "")) if errs else "") + " " + (str(errs[0].get("message", ""))[:80] if errs else "")
              print(f"GET {name}: {code} | created: {str(res.get('created_on', ''))[:10]} | {err.strip() if err else 'OURS'}")

          code, d = api(f"/accounts/{ACC}/pages/projects", "POST", {
              "name": "dashboard",
              "production_branch": "main",
              "source": {
                  "type": "github",
                  "owner": "skmstudioservices-cyber",
                  "repo_name": "my-dashboard",
                  "production_branch": "main",
                  "deployments_enabled": True,
              },
          })
          print("CREATE dashboard:", code, json.dumps(d)[:500])
          EOF

