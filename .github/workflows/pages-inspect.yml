name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll corrected tags 5-6
        run: |
          set -e
          T="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nI"
          for i in $(seq 1 10); do
            out=""; allok=1
            for s in aadhaar-seva-kendra-near-me bloodbanksnearme; do
              tag=$(curl -sL --max-time 15 "https://$s.pages.dev/?cb=$RANDOM$i" | grep -c "$T" || true)
              out="$out $s=$tag"
              [ "$tag" -lt 1 ] && allok=0
            done
            echo "check $i:$out"
            [ "$allok" = "1" ] && { echo "BOTH CORRECTED TAGS LIVE"; exit 0; }
            sleep 30
          done
          echo "STILL NOT LIVE"

