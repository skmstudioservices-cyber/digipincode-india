name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Poll 5 new sites
        run: |
          set -e
          for i in $(seq 1 12); do
            out=""; allok=1
            for s in airqualitynearme earthquakenearme isrotracker bharatlive issspotter; do
              c=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 15 "https://$s.pages.dev/")
              t=$(grep -c "google-site-verification" /tmp/i.html || true)
              out="$out $s=$c/$t"
              [ "$c" = "200" ] && [ "$t" -ge 1 ] || allok=0
            done
            echo "check $i:$out"
            [ "$allok" = "1" ] && { echo "ALL 5 SITES LIVE"; exit 0; }
            sleep 30
          done
          echo "NOT ALL LIVE YET"

