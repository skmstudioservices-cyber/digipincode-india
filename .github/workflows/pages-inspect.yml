name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Diagnose + trigger pages builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, time, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          SITES = ["bloodbanksnearme", "toiletsnearme", "cngpumpsnearme", "evchargersnearme", "restareanearme", "aadhaar-seva-kendra-near-me"]

          print("--- diagnose: existing deployments ---")
          for s in SITES:
              code, d = api(f"/accounts/{ACC}/pages/projects/{s}/deployments")
              deps = d.get("result") or []
              if not deps:
                  print(f"{s}: NO deployments at all")
              else:
                  dep = deps[0]
                  print(f"{s}: {len(deps)} dep | env={dep.get('environment')} | stage={dep.get('latest_stage',{}).get('name')}:{dep.get('latest_stage',{}).get('status')} | build_config={json.dumps((dep.get('build_config') or {}))[:120]}")

          print("--- trigger rebuild via API ---")
          for s in SITES:
              code, d = api(f"/accounts/{ACC}/pages/projects/{s}/deployments", "POST", {})
              ok = d.get("success")
              err = json.dumps(d.get("errors"))[:150]
              print(f"{s}: {code} success={ok} {err if not ok else ''}")
              time.sleep(2)

          print("--- wait up to 4 min for builds ---")
          deadline = time.time() + 240
          done = set()
          while time.time() < deadline and len(done) < len(SITES):
              for s in SITES:
                  if s in done: continue
                  code, d = api(f"/accounts/{ACC}/pages/projects/{s}/deployments")
                  deps = d.get("result") or []
                  if deps:
                      st = deps[0].get("latest_stage", {}).get("status")
                      if st in ("success", "failure"):
                          print(f"{s}: {st} (stage: {deps[0].get('latest_stage',{}).get('name')})")
                          done.add(s)
              if len(done) < len(SITES): time.sleep(20)

          print("--- live check ---")
          for s in SITES:
              try:
                  r = urllib.request.urlopen("https://" + s + ".pages.dev/", timeout=15)
                  print(f"{s}: HTTP {r.status} LIVE")
              except Exception as e:
                  print(f"{s}: {type(e).__name__} {str(e)[:60]}")
          EOF

