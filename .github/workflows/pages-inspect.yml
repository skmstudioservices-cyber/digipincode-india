name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check karvachauth pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== karvachauth.pages.dev live check ==="
          code=$(curl -s -o /tmp/kc.html -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "https://karvachauth.pages.dev/")
          size=$(wc -c < /tmp/kc.html)
          echo "HTTP $code (${size}b)"
          grep -o 'google-site-verification" content="[^"]*' /tmp/kc.html && echo "GSC TAG PRESENT" || echo "GSC TAG ABSENT"
          echo "=== karvachauth deployment list ==="
          npx --yes wrangler pages deployment list --project-name=karvachauth
