name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for U in "digipincode.india-in.workers.dev/" "digipincode.pages.dev/"; do
            CODE=$(curl -s -L -o /tmp/d.html -w "%{http_code}" --max-time 25 "https://$U")
            TAG=$(grep -c "G-30JK9GG08F" /tmp/d.html || true)
            echo "DPCHECK $U -> $CODE GA_TAG=$TAG"
          done
