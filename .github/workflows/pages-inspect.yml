name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Byte truth
        run: |
          set -e
          echo "===== od line 71 area ====="; sed -n '69,72p' src/pages/'[...path]'.astro | od -c | head -20
          echo "===== od givenPin ====="; grep -n "const givenPin" src/pages/'[...path]'.astro | head -2
          sed -n '74p' src/pages/'[...path]'.astro | od -c | tail -4

