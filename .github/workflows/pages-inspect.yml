name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== digipincode homepage first 250 chars ==="
          curl -sL --max-time 25 -A "Mozilla/5.0" "https://digipincode.india-in.workers.dev/" | head -c 250
          echo ""
          echo "=== mapsnearme homepage first 250 chars ==="
          curl -sL --max-time 25 -A "Mozilla/5.0" "https://mapsnearme.pages.dev/" | head -c 250
          echo ""
          echo "=== CF Pages deployments (latest per project) ==="
          for p in mapsnearme dashboardmapsnearme; do
            curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/pages/projects/$p/deployments?per_page=2" > /tmp/d.json
            python3 - "$p" << 'PY'
            import json, sys
            d = json.load(open('/tmp/d.json'))
            for dep in (d.get('result') or {}).get('deployments', []):
                src = dep.get('deployment_trigger') or {}
                meta = dep.get('meta') or {}
                print(sys.argv[1], '|', dep.get('id','')[:8], '|', dep.get('latest_stage',{}).get('name'), dep.get('latest_stage',{}).get('status'), '|', dep.get('env'), '|', (meta.get('commit_message') or '')[:60])
            print('success:', d.get('success'), '| errors:', str(d.get('errors'))[:120])
            PY
          done
