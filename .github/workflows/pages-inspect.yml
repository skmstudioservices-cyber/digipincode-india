name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump deploy workflows
        run: |
          set -e
          echo "===== deploy.yml ====="; cat .github/workflows/deploy.yml
          echo "===== pages-mirror.yml head ====="; head -40 .github/workflows/pages-mirror.yml

