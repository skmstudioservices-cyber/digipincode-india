name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll AQI city pages
        run: |
          set -e
          for i in $(seq 1 8); do
            out=""; allok=1
            for s in "" delhi mumbai chandigarh nagpur; do
              c=$(curl -sL -o /tmp/p.html -w "%{http_code}" --max-time 15 "https://airqualitynearme.pages.dev/$s")
              g=$(grep -c "google-site-verification" /tmp/p.html || true)
              q=$(grep -c "live" /tmp/p.html || true)
              out="$out [/$s]=$c/$g"
              { [ "$c" = "200" ] && [ "$g" -ge 1 ]; } || allok=0
            done
            echo "check $i:$out"
            [ "$allok" = "1" ] && { echo "ALL CITY PAGES LIVE"; exit 0; }
            sleep 30
          done
          echo "NOT ALL LIVE"

