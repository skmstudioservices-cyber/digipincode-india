name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify external-links removal
        run: |
          set -e
          sleep 90
          for s in restareanearme aadhaar-seva-kendra-near-me bloodbanksnearme; do
            code=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/)
            ext=$(grep -c 'card official' /tmp/i.html || true)
            gsc=$(grep -c 'GSC-VERIFY' /tmp/i.html)
            monetag=$(grep -c 'MONETAG' /tmp/i.html)
            title=$(grep -o "<title>[^<]*" /tmp/i.html | head -1 | cut -c8-70)
            echo "$s | HTTP $code | external-cards: $ext | gsc-marker: $gsc | monetag-marker: $monetag | $title"
          done

