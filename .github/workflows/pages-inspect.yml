name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump heads
        run: |
          for u in https://digipincode.india-in.workers.dev https://mapsnearme.pages.dev https://examstatus.india-in.workers.dev https://dashboardmapsnearme.pages.dev; do
            echo "===== $u"
            curl -sL --max-time 25 -A "Mozilla/5.0" "$u/" -o /tmp/h.html || true
            echo "bytes: $(wc -c < /tmp/h.html)"
            grep -oiP '<title>[^<]*</title>' /tmp/h.html | head -1
            grep -oiP '<meta[^>]*(og:site_name|theme-color)[^>]*>' /tmp/h.html | head -3
            grep -oiP '<link[^>]*icon[^>]*>' /tmp/h.html | head -4
            grep -c 'WebSite' /tmp/h.html || true
          done
