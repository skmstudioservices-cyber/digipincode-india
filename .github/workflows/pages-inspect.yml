name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create 5 CF Pages projects
        run: |
          set -e
          for name in airqualitynearme earthquakenearme isrotracker bharatlive issspotter; do
            echo "=== $name ==="
            R=$(curl -s --max-time 30 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"name\":\"$name\",\"production_branch\":\"main\",\"source\":{\"type\":\"github\",\"config\":{\"owner\":\"skmstudioservices-cyber\",\"repo_name\":\"$name\",\"production_branch\":\"main\",\"deployments_enabled\":true}}}")
            echo "$R" | jq -c '{success, name: .result.name, domains: .result.domains, err: .errors}'
            curl -s --max-time 30 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$name/deployments" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{}' | jq -c '{deploy: .success}'
          done

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
