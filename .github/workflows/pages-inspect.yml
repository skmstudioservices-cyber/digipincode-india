name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify GSC tags live on digipincode (mirror + workers)
        run: |
          set +e
          for u in "https://digipincode.pages.dev/" "https://digipincode.india-in.workers.dev/"; do
            code=$(curl -s -o /tmp/f.html -w "%{http_code}" --max-time 25 -A "Mozilla/5.0 (Linux; Android 10)" "$u")
            echo "$u -> HTTP $code"
            echo "  GlkDu5ZL tag count: $(grep -c 'GlkDu5ZL' /tmp/f.html || true)"
          done
