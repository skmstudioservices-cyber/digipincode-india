name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Per-worker quota breakdown
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== PER-WORKER REQUESTS: TODAY ==="
          TODAY=$(date -u +%F)
          jq -n --arg q "query { viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { workersInvocationsAdaptive(limit: 100, filter: {datetime_geq: \"${TODAY}T00:00:00Z\"}) { sum { requests } dimensions { scriptName } } } } }" '{query: $q}' \
            | curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @- \
            https://api.cloudflare.com/client/v4/graphql \
            | jq -c '[.data.viewer.accounts[0].workersInvocationsAdaptive[] | {script: .dimensions.scriptName, req: .sum.requests}] | sort_by(-.req)'
          echo "=== PER-WORKER REQUESTS: YESTERDAY (full day) ==="
          YDAY=$(date -u -d yesterday +%F)
          jq -n --arg q "query { viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { workersInvocationsAdaptive(limit: 100, filter: {datetimeHour_geq: \"${YDAY}T00:00:00Z\", datetimeHour_leq: \"${YDAY}T23:59:59Z\"}) { sum { requests } dimensions { scriptName } } } } }" '{query: $q}' \
            | curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @- \
            https://api.cloudflare.com/client/v4/graphql \
            | jq -c '[.data.viewer.accounts[0].workersInvocationsAdaptive[] | {script: .dimensions.scriptName, req: .sum.requests}] | sort_by(-.req)'
          echo "=== WORKERS WITH CRON TRIGGERS ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -c '[.result[] | {id, modified_on: .modified_on[0:10]}]'
          echo "=== TOP REQUESTED URLS (http_requests, today, by host) ==="
          jq -n --arg q "query { viewer { zones(filter: {zoneTag: \"\"}) { httpRequestsAdaptive(limit: 10) { sum { requests } dimensions { clientCountryName } } } } }" '{query: $q}' > /dev/null 2>&1
          echo "(no zones on this account — pages/workers only)"
