name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Domain availability check (RDAP)
        run: |
          set +e
          for d in raktsanchaar.com madadkendra.com madadnumber.com sosbharat.com bharathelpline.com helplinebharat.com jansanket.com surakshasanket.com rahatkendra.com suchnakendra.com sahayatakendra.com aapadaalerts.com emergencybharat.com madadsanket.com raktsanchaar.in; do
            code=$(curl -sL -o /tmp/r.json -w "%{http_code}" --max-time 15 "https://rdap.org/domain/$d")
            if [ "$code" = "404" ]; then st="AVAILABLE"
            elif [ "$code" = "200" ]; then st="TAKEN ($(cat /tmp/r.json | jq -r '.events[]? | select(.eventAction=="registration") | .eventDate' 2>/dev/null | cut -c1-4))"
            else st="unknown($code)"; fi
            echo "$d -> $st"
          done
