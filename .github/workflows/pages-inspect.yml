name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          sleep 120
          TS=$(date +%s)
          for U in "digipincode.india-in.workers.dev/" "digipincode.india-in.workers.dev/digipin/" "digipincode.pages.dev/" "digipincode.pages.dev/digipin/"; do
            CODE=$(curl -s -L -o /tmp/d.html -w "%{http_code}" --max-time 25 "https://$U?v=$TS" || echo 000)
            TAG=$(grep -c "G-30JK9GG08F" /tmp/d.html 2>/dev/null || true)
            echo "CB $U -> $CODE GA_TAG=$TAG (cache-busted)"
          done
          echo "=== queue status ==="
