name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Data fetch retry
        run: |
          echo "=== DNS ==="
          python3 -c "
          import socket
          for n in ['aqinearme','earthquakenearme','isrolaunches','bharatlive','issspotter']:
              try:
                  socket.gethostbyname(n + '.pages.dev'); print(n, 'TAKEN')
              except Exception: print(n, 'AVAILABLE')
          "
          echo "=== AQI ==="
          curl -s --retry 3 --retry-delay 5 --max-time 30 "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=28.61&longitude=77.23&current=us_aqi,pm2_5,pm10" || echo AQI_FAIL
          echo ""
          echo "=== USGS ==="
          curl -s --retry 3 --retry-delay 5 --max-time 30 "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minlatitude=5&maxlatitude=38&minlongitude=65&maxlongitude=98&minmagnitude=4&orderby=time&limit=10" -o /tmp/q.json || echo USGS_FAIL
          python3 -c "
          import json
          d = json.load(open('/tmp/q.json'))
          q = [{'mag': f['properties']['mag'], 'place': f['properties']['place'], 'time': f['properties']['time'], 'lat': f['geometry']['coordinates'][1], 'lon': f['geometry']['coordinates'][0]} for f in d['features']]
          print('QUAKES=' + json.dumps(q))
          " || echo QUAKES_PARSE_FAIL
          echo "=== LL2 ==="
          curl -s --retry 3 --retry-delay 5 --max-time 30 "https://ll.thespacedevs.com/2.2.0/launches/upcoming/?limit=8&mode=list" -o /tmp/l.json || echo LL2_FAIL
          python3 -c "
          import json
          d = json.load(open('/tmp/l.json'))
          l = [{'name': r['name'], 'agency': (r.get('launch_service_provider') or {}).get('name'), 'net': r['net'], 'status': (r.get('status') or {}).get('abbrev')} for r in d['results']]
          print('LAUNCHES=' + json.dumps(l))
          " || echo LL2_PARSE_FAIL
          echo "=== ISS ==="
          curl -s --retry 3 --retry-delay 5 --max-time 30 "https://api.wheretheiss.at/v1/satellites/25544" || echo ISS_FAIL
          echo ""

