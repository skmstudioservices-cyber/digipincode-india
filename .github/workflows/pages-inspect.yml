name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump routing/sitemap/robots
        run: |
          set -e
          echo "===== PUBLIC DIR ====="; ls -la public/ 2>/dev/null | head -30 || echo "no public/"
          echo "===== ROBOTS ====="; find . -name "robots*" -not -path "./node_modules/*" | head; for f in $(find . -name "robots*" -not -path "./node_modules/*"); do echo "--- $f ---"; cat "$f"; done
          echo "===== MIDDLEWARE ====="; cat src/middleware.ts 2>/dev/null | head -80
          echo "===== sitemap.xml.ts ====="; cat src/pages/sitemap.xml.ts | head -60
          echo "===== sitemap-index.xml.ts ====="; cat src/pages/sitemap-index.xml.ts | head -80
          echo "===== sitemap-[slug].xml.ts ====="; cat "src/pages/sitemap-[slug].xml.ts" | head -60
          echo "===== 301 / redirect logic in catch-all ====="; grep -n "301\|redirect\|tehsil\|Redirect" src/pages/'[...path]'.astro | head -50
          echo "===== robots in code ====="; grep -rn "robots" src/ --include=*.ts --include=*.astro | grep -v node_modules | head -20

