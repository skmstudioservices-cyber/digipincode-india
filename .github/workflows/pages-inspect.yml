name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump routing details
        run: |
          set -e
          echo "===== LIB DIR ====="; ls src/lib/ src/config/ 2>/dev/null
          echo "===== URLS LIB ====="; for f in src/lib/urls.ts src/lib/url.ts src/config/site.ts src/config/index.ts src/config.ts; do [ -f "$f" ] && echo "--- $f ---" && cat "$f" | head -60; done
          echo "===== BASE const ====="; grep -rn "BASE" src/pages/'[...path]'.astro | head -8
          echo "===== CATCH-ALL FULL 1-130 ====="; sed -n '1,130p' src/pages/'[...path]'.astro
          echo "===== SITEMAP SLUG FULL ====="; cat "src/pages/sitemap-[slug].xml.ts"
          echo "===== VILLAGES TABLE SCHEMA ====="; grep -rn "CREATE TABLE" migrations/ db/ schema* 2>/dev/null | head; ls migrations/ 2>/dev/null | head

