name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reference UI + CF state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "==== dashboardmapsnearme UI sample ===="
          curl -s --max-time 20 https://dashboardmapsnearme.pages.dev/ -o /tmp/dm.html
          wc -c /tmp/dm.html
          echo "-- head/style --"
          head -c 3500 /tmp/dm.html
          echo
          echo "-- key UI hints --"
          grep -oE 'class="[^"]{3,60}"' /tmp/dm.html | sort -u | head -30
          grep -oE '<(section|nav|aside|header|main)[^>]*>' /tmp/dm.html | head -15
          echo
          echo "==== linked css/js ===="
          grep -oE '(href|src)="[^"]*\.(css|js)[^"]*"' /tmp/dm.html | head -10
          echo
          echo "==== CF projects ===="
          python3 << 'EOF'
          import os, json, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")
          for name in ["my-dashboard", "my-dashboard-2av", "skm-spoc"]:
              code, d = api(f"/accounts/{ACC}/pages/projects/{name}")
              res = d.get("result") or {}
              src = (res.get("source") or {}).get("type") or "direct-upload"
              repo = ((res.get("source") or {}).get("config") or {}).get("repo_name")
              print(f"{name}: {code} | subdomain: {res.get('subdomain')} | source: {src} {repo or ''} | created: {str(res.get('created_on',''))[:10]}")
          EOF

