name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify 6 sites live
        run: |
          set -e
          for s in bloodbanksnearme toiletsnearme cngpumpsnearme evchargersnearme restareanearme aadhaar-seva-kendra-near-me; do
            code=$(curl -s -o /tmp/b.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/)
            title=$(grep -o "<title>[^<]*" /tmp/b.html | head -1 | cut -c8-60)
            robots=$(curl -s --max-time 10 https://$s.pages.dev/robots.txt | tr '\n' ' ' | head -c 60)
            echo "$s | HTTP $code | $title | robots: $robots"
          done

