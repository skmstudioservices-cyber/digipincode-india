name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: cng failure logs
        run: |
          set -e
          echo "--- cng failure logs ---"
          curl -s --max-time 20 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cngpumpsnearme/deployments/e6c773b7-0000-0000-0000-000000000000/logs" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 800
          echo ""
          echo "--- cng deployment detail ---"
          DEP=$(curl -s --max-time 20 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cngpumpsnearme/deployments?per_page=1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$DEP" | jq -r '.result[0] | {id, is_skipped, build_config, env_vars, stages: [.stages[]? | {name, status}]}' | head -c 1500
          echo ""
          echo "--- live tag check all 6 ---"
          T="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nl"
          for s in toiletsnearme cngpumpsnearme evchargersnearme restareanearme aadhaar-seva-kendra-near-me bloodbanksnearme; do
            curl -sL --max-time 15 "https://$s.pages.dev/?cb=$RANDOM" -o /tmp/i.html
            echo "$s live $(grep -c "$T" /tmp/i.html || true)"
          done

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
