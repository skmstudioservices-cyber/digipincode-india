name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deep diagnose 403
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          for s in ["bloodbanksnearme", "mapsnearme"]:
              print("=====", s, "(mapsnearme = known-good git-connected reference) =====")
              code, d = api(f"/accounts/{ACC}/pages/projects/{s}")
              res = d.get("result") or {}
              print("canonical_deployment:", (res.get("canonical_deployment") or {}).get("id"))
              src = (res.get("source") or {}).get("config") or {}
              print("source:", json.dumps(src)[:220])
              code, d = api(f"/accounts/{ACC}/pages/projects/{s}/deployments")
              for dep in (d.get("result") or [])[:2]:
                  print("  dep:", dep.get("id", "")[:8],
                        "| env:", dep.get("environment"),
                        "| branches:", dep.get("branches"),
                        "| alias:", dep.get("alias"),
                        "| urls:", dep.get("urls"),
                        "| trigger:", json.dumps(dep.get("deployment_trigger"))[:140])
          EOF
          echo "---- raw 403 headers for bloodbanksnearme ----"
          curl -sS -D - -o /tmp/body.html https://bloodbanksnearme.pages.dev/ | head -20
          echo "---- body ----"
          head -c 400 /tmp/body.html
          echo
          echo "---- retry after warmup ----"
          sleep 45
          for s in bloodbanksnearme toiletsnearme cngpumpsnearme evchargersnearme restareanearme aadhaar-seva-kendra-near-me; do
            curl -s -o /dev/null -w "$s -> %{http_code}\n" https://$s.pages.dev/
          done

