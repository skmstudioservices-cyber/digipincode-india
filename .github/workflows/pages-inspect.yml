name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Verify both UIs live
        run: |
          set -e
          echo "waiting 100s for Pages build..."
          sleep 100
          for u in "" zenith.html; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/p.html -w "%{http_code}" --max-time 20 "https://my-dashboard-2av.pages.dev/$u")
              [ "$code" = "200" ] && break
              sleep 35
            done
            echo "== /$u -> HTTP $code =="
            grep -o "<title>[^<]*" /tmp/p.html
          done
          echo "-- classic has zenith switch:"; curl -s --max-time 15 https://my-dashboard-2av.pages.dev/ | grep -c "zenith.html"
          echo "-- zenith has comments+theme:"; curl -s --max-time 15 https://my-dashboard-2av.pages.dev/zenith.html | grep -c "cycleTheme\|spoc_comments_v1"

