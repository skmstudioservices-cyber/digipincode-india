name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: |
          sleep 150
          TS=$(date +%s)
          declare -A SITES=( ["https://floodsnearme.pages.dev/"]="G-S9LPPYLJNR" ["https://floodsnearme.pages.dev/chhattisgarh-floods-2026/"]="G-S9LPPYLJNR" ["https://floodsnearme.pages.dev/privacy/"]="G-S9LPPYLJNR" ["https://asiangamesmedaltally2026.pages.dev/"]="G-2B2GJVCH3N" ["https://asiangamesmedaltally2026.pages.dev/india-medal-winners/"]="G-2B2GJVCH3N" ["https://asiangamesmedaltally2026.pages.dev/privacy/"]="G-2B2GJVCH3N" ["https://digipincode.india-in.workers.dev/"]="G-99Z495K2T8" ["https://digipincode.pages.dev/"]="G-99Z495K2T8" )
          for U in "${!SITES[@]}"; do
            G="${SITES[$U]}"
            CODE=$(curl -s -L -o /tmp/v.html -w "%{http_code}" --max-time 25 "$U?v=$TS" || echo 000)
            TAG=$(grep -c "$G" /tmp/v.html 2>/dev/null || true)
            echo "TAGCHECK $U -> $CODE TAG=$TAG"
          done
