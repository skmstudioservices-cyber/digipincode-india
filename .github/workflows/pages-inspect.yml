name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify v3 map sites
        run: |
          set -e
          sleep 150
          for s in toiletsnearme cngpumpsnearme evchargersnearme; do
            code=$(curl -sL -o /tmp/i.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/)
            ccode=$(curl -sL -o /tmp/c.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/delhi/)
            xcode=$(curl -sL -o /tmp/x.html -w "%{http_code}" --max-time 20 https://$s.pages.dev/chandigarh/)
            mcode=$(curl -sL -o /tmp/m.json -w "%{http_code}" --max-time 20 https://$s.pages.dev/data/manifest.json)
            info=$(python3 -c "import json;d=json.load(open('/tmp/m.json'));print(sum(c['n'] for c in d['cities'].values()),'POIs in',len(d['cities']),'cities')" 2>/dev/null || echo "manifest $mcode")
            ext=$(grep -c "card official" /tmp/i.html /tmp/c.html || true)
            dp=$(grep -c "DIGIPIN" /tmp/i.html)
            echo "$s | home $code | /delhi/ $ccode | /chandigarh/ $xcode | $info | external-cards:$ext | digipin-refs:$dp"
          done

