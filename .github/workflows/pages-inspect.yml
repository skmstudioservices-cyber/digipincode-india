name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: CF create dashboard pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, time, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          code, d = api(f"/accounts/{ACC}/pages/projects", "POST", {
              "name": "dashboard",
              "production_branch": "main",
              "source": {
                  "type": "github",
                  "config": {
                      "owner": "skmstudioservices-cyber",
                      "repo_name": "my-dashboard",
                      "production_branch": "main",
                      "deployments_enabled": True
                  }
              }
          })
          print("CREATE dashboard:", code)
          print(json.dumps(d)[:600])
          if code in (200, 201):
              time.sleep(90)
              import socket
              try:
                  socket.getaddrinfo("dashboard.pages.dev", 443, proto=socket.IPPROTO_TCP)
                  print("DNS: dashboard.pages.dev RESOLVES")
              except Exception:
                  print("DNS: not resolving yet (deploy may still be queued)")
              req = urllib.request.Request("https://dashboard.pages.dev/")
              try:
                  r = urllib.request.urlopen(req, timeout=15)
                  body = r.read().decode()[:200]
                  print("HTTP", r.status, "|", body.replace("\n", " ")[:180])
              except Exception as e:
                  print("HTTP check:", type(e).__name__, str(e)[:120])
          EOF

