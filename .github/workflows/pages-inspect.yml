name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Retry cng + poll all
        run: |
          set -e
          echo "--- retry cng deployment ---"
          curl -s --max-time 20 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cngpumpsnearme/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{}' | jq -c '{success, id: .result.id[0:8]}'
          T="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nl"
          for i in $(seq 1 12); do
            out=""; allok=1
            for s in toiletsnearme cngpumpsnearme evchargersnearme restareanearme aadhaar-seva-kendra-near-me bloodbanksnearme; do
              curl -sL --max-time 15 "https://$s.pages.dev/?cb=$RANDOM$i" -o /tmp/i.html
              tag=$(grep -c "$T" /tmp/i.html || true)
              out="$out $s=$tag"
              if [ "$tag" -lt 1 ]; then allok=0; fi
            done
            echo "check $i:$out"
            if [ "$allok" = "1" ]; then echo "ALL 6 GSC TAGS LIVE"; exit 0; fi
            sleep 30
          done
          echo "STILL NOT ALL LIVE"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
