name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Pages project + request analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== Pages project detail ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/digipincode" \
            | jq '{name: .result.name, domains: .result.domains, production_branch: .result.production_branch, canonical: .result.canonical_deployment.id, created: .result.created_on}'
          echo "=== Workers request volume (last 3 days, script=digipincode) ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query": "query { viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { workersInvocationsAdaptive(limit: 100, filter: {scriptName: \"digipincode\", datetime_geq: \"2026-09-19T00:00:00Z\"}, orderBy: [datetimeDay_ASC]) { sum { requests } dimensions { datetimeDay scriptName } } } } }"}' \
            https://api.cloudflare.com/client/v4/graphql \
            | jq '.data.viewer.accounts[0].workersInvocationsAdaptive'
