name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: mapsnearme sitemap diagnosis
        run: |
          set +e
          echo "=== LIVE (quota-dead window - static assets should still serve) ==="
          for p in "robots.txt" "sitemap.xml" "sitemap-index.xml" ""; do
            code=$(curl -s -o /tmp/f -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "https://mapsnearme.pages.dev/$p")
            echo "/$p -> HTTP $code ($(wc -c < /tmp/f)b)"
          done
          echo "=== robots.txt content ==="
          curl -s --max-time 20 "https://mapsnearme.pages.dev/robots.txt" | head -15
          echo "=== sitemap.xml first 400 chars ==="
          curl -s --max-time 25 "https://mapsnearme.pages.dev/sitemap.xml" | head -c 400
