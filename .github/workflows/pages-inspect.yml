name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify robots live
        run: |
          set +e
          echo "===== digipincode robots: new bots ====="
          curl -s https://digipincode.india-in.workers.dev/robots.txt | grep -cE "^User-agent:" 
          curl -s https://digipincode.india-in.workers.dev/robots.txt | grep -E "Claude-Web|AhrefsBot|Baiduspider|GoogleOther|Gemini-Deep"
          echo "===== mapsnearme robots ====="
          curl -s https://mapsnearme.pages.dev/robots.txt | grep -cE "^User-agent:"
          curl -s https://mapsnearme.pages.dev/robots.txt | grep -E "Claude-SearchBot|Sitemap"
          echo "===== examstatus robots ====="
          curl -s https://examstatus.india-in.workers.dev/robots.txt | grep -cE "^User-agent:"
          curl -s https://examstatus.india-in.workers.dev/robots.txt | grep -E "Claude-SearchBot|Sitemap"
          echo "===== starter site check: toiletsnearme.github.io style (repo only, not hosted) ====="
          echo "===== dashboard robots ====="
          curl -s https://dashboardmapsnearme.pages.dev/robots.txt | grep -cE "^User-agent:" || echo "not deployed yet / private"

