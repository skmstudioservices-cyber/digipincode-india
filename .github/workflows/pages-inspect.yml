name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Create 6 pages projects + connect repos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, time, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          SITES = [
              ("bloodbanksnearme", "bloodbanksnearme"),
              ("toiletsnearme", "toiletsnearme"),
              ("cngpumpsnearme", "cngpumpsnearme"),
              ("evchargersnearme", "EVchargersnearme"),
              ("restareanearme", "restareanearme"),
              ("aadhaar-seva-kendra-near-me", "Aadhaar-Seva-Kendra-near-me"),
          ]
          created, failed = [], []
          for proj, repo in SITES:
              code, d = api(f"/accounts/{ACC}/pages/projects", "POST", {
                  "name": proj, "production_branch": "main",
                  "source": {"type": "github", "config": {
                      "owner": "skmstudioservices-cyber", "repo_name": repo,
                      "production_branch": "main", "deployments_enabled": True}}})
              sub = ((d.get("result") or {}).get("subdomain")) or ""
              if code in (200, 201) and sub == proj + ".pages.dev":
                  print(f"CREATED  {proj} -> {sub}")
                  created.append(proj)
              elif code in (200, 201):
                  api(f"/accounts/{ACC}/pages/projects/{proj}", "DELETE")
                  print(f"TAKEN    {proj} (got suffixed '{sub}' - deleted per policy)")
                  failed.append(proj)
              else:
                  print(f"FAIL     {proj}: {code} {json.dumps(d.get('errors'))[:180]}")
                  failed.append(proj)

          print("--- waiting for first builds ---")
          deadline = time.time() + 300
          done = set()
          while time.time() < deadline and len(done) < len(created):
              for proj in created:
                  if proj in done: continue
                  code, d = api(f"/accounts/{ACC}/pages/projects/{proj}/deployments")
                  deps = d.get("result") or []
                  if deps and deps[0].get("latest_stage", {}).get("status") == "success":
                      done.add(proj)
                      print(f"DEPLOYED {proj}")
              if len(done) < len(created): time.sleep(15)

          print("--- live verification ---")
          for proj in created:
              try:
                  r = urllib.request.urlopen("https://" + proj + ".pages.dev/", timeout=15)
                  body = r.read().decode()
                  t = body.find("<title>")
                  print(f"LIVE     https://{proj}.pages.dev/ -> HTTP {r.status} | {body[t+7:body.find('</title>')][:50]}")
              except Exception as e:
                  print(f"CHECK    https://{proj}.pages.dev/ -> {type(e).__name__} {str(e)[:80]}")
          EOF

