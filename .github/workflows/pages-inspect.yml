name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CF cleanup + inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 << 'EOF'
          import os, json, urllib.request
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACC = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                  data=json.dumps(body).encode() if body else None, method=method,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          # 1) inspect skm-spoc (the user's "random page" from 23 Sep)
          code, d = api(f"/accounts/{ACC}/pages/projects/skm-spoc")
          res = d.get("result") or {}
          src = (res.get("source") or {}).get("config") or {}
          print("SKM-SPOC:", code,
                "| subdomain:", res.get("subdomain"),
                "| repo:", src.get("owner", "?") + "/" + str(src.get("repo_name", "?")),
                "| branch:", src.get("production_branch"),
                "| created:", str(res.get("created_on", ""))[:10])

          # 2) delete the auto-suffixed 'dashboard' project (name taken globally -> CF made dashboard-bjc)
          code, d = api(f"/accounts/{ACC}/pages/projects/dashboard", "DELETE")
          print("DELETE dashboard:", code, "| success:", d.get("success"))

          # 3) confirm skm-spoc live content
          try:
              body = urllib.request.urlopen("https://skm-spoc.pages.dev/", timeout=10).read().decode()
              import re
              t = re.search(r"<title>(.*?)</title>", body, re.S)
              print("skm-spoc live title:", (t.group(1).strip()[:80] if t else body[:120].replace("\n", " ")))
          except Exception as e:
              print("skm-spoc live check:", type(e).__name__, str(e)[:100])
          EOF

