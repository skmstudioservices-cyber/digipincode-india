name: Pages Inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: D1 recon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "=== wrangler.toml (d1 section) ==="
          grep -A6 "d1_databases" wrangler.toml || echo "no d1 in toml"
          echo "=== D1 tables ==="
          DB=$(grep -oP 'database_name = "\K[^"]+' wrangler.toml | head -1)
          echo "DB=$DB"
          npx --yes wrangler d1 execute "$DB" --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print([r['name'] for r in d[0]['results']])" || echo "table list failed"
          echo "=== trending/query-like table schemas ==="
          for T in trending_queries search_queries popular_queries queries keywords popular_searches; do
            SC=$(npx --yes wrangler d1 execute "$DB" --remote --command "SELECT sql FROM sqlite_master WHERE name='$T'" --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['results'][0]['sql'] if d[0]['results'] else '')" 2>/dev/null || echo "")
            if [ -n "$SC" ]; then echo "TABLE $T: $SC"; fi
          done
