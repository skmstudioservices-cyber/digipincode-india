name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Worker diagnostic
        run: |
          set -e
          code=$(curl -s -o /tmp/w.txt -w "%{http_code}" --max-time 25 -X POST https://spoc-writer.india-in.workers.dev/ -H "Content-Type: application/json" -d '{"passcode":"test-diagnostic","op":"gsc","repo":"toiletsnearme","code":"test"}')
          echo "HTTP $code"
          head -c 300 /tmp/w.txt
          echo ""

