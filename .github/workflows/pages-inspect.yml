name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify safe-alleys live
        run: |
          set -e
          sleep 60
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/b.html -w "%{http_code}" --max-time 20 https://safe-alleys.pages.dev/)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 45
          done
          title=$(grep -o "<title>[^<]*" /tmp/b.html | head -1 | cut -c8-60)
          robots=$(curl -s --max-time 10 https://safe-alleys.pages.dev/robots.txt | head -2 | tr '\n' ' ')
          echo "title: $title"
          echo "robots: $robots"

