name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump village render
        run: |
          set -e
          echo "===== CATCH-ALL 185-250 ====="; sed -n '185,250p' src/pages/'[...path]'.astro

