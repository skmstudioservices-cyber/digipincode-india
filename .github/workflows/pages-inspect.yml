name: Pages Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { path: dpc, fetch-depth: 0 }
      - name: Deploy topology deep dive
        run: |
          cd dpc
          echo "=== deploy.yml (triggers + jobs) ==="
          head -25 .github/workflows/deploy.yml
          echo "=== karvachauth-bootstrap.yml ==="
          cat .github/workflows/karvachauth-bootstrap.yml | head -50
          echo "=== mapsnearme-deploy.yml triggers ==="
          head -15 .github/workflows/mapsnearme-deploy.yml
          echo "=== BOOTSTRAP BRANCH ==="
          git fetch origin karvachauth-bootstrap --quiet && echo fetched
          git ls-tree --name-only origin/karvachauth-bootstrap | head -15
          echo "=== BOOTSTRAP deploy.yml ==="
          git show origin/karvachauth-bootstrap:.github/workflows/deploy.yml 2>/dev/null | head -35
          echo "=== Base.astro frontmatter (1-55) ==="
          head -55 src/layouts/Base.astro
          echo "=== orgLd definition ==="
          grep -n -A8 "orgLd" src/layouts/Base.astro | head -25
