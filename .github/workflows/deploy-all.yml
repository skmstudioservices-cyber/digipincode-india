name: Deploy all repos (bridge, batched)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "repo name to deploy, or 'all'"
        default: "all"
      batch:
        description: "how many sites in parallel (1-3)"
        default: "2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          node -e '
          const fs=require("fs");
          const cfg=JSON.parse(fs.readFileSync("sites.json","utf8"));
          const only=process.env.ONLY||"all";
          let s=cfg.sites.filter(x=>x.enabled);
          if(only!=="all") s=s.filter(x=>x.repo===only||x.project===only);
          console.log("matrix="+JSON.stringify({include:s.map(x=>({repo:x.repo,type:x.type,project:x.project,branch:x.branch}))}));
          ' >> "$GITHUB_OUTPUT"
        env:
          ONLY: ${{ github.event.inputs.only }}

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.batch || '2') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Deploy ${{ matrix.repo }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO: ${{ matrix.repo }}
          TYPE: ${{ matrix.type }}
          PROJECT: ${{ matrix.project }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          W=$(mktemp -d)
          curl -sSL "https://codeload.github.com/skmstudioservices-cyber/$REPO/tar.gz/refs/heads/main" | tar -xz -C "$W" --strip-components=1
          cd "$W"
          rm -rf .github scripts || true

          case "$TYPE" in
            pages-static)
              npx --yes wrangler@4 pages deploy . --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true
              ;;
            pages-build)
              npm install --no-audit --no-fund
              npm run build
              npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true
              ;;
            worker)
              npm install --no-audit --no-fund
              npm run build --if-present
              npx --yes wrangler@4 deploy
              ;;
            *)
              echo "unclassified repo $REPO — skipped"; exit 0
              ;;
          esac
