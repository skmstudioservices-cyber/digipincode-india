name: Examstatus Deploy (bridge)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout examstatus
        uses: actions/checkout@v4
        with:
          repository: skmstudioservices-cyber/examstatus
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
      - name: Verify live
        run: |
          sleep 25
          echo "favicon.ico: $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://examstatus.india-in.workers.dev/favicon.ico)"
          curl -s --max-time 30 https://examstatus.india-in.workers.dev/ | grep -o 'og:site_name[^>]*' | head -2 || echo "og:site_name NOT FOUND"
