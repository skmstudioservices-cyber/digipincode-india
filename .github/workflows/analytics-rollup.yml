name: Analytics Rollup

# Runs just before the D1 daily quota reset (00:00 UTC = 05:30 IST).
# Rebuilds the previous UTC day into the aggregate tables so dashboards
# never scan raw rows.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to rebuild (default 1)'
        required: false
        default: '1'
  schedule:
    - cron: '45 23 * * *'

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply rollup SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest d1 execute analytics-db --remote --file=analytics-worker/rollup.sql -c analytics-worker/wrangler.jsonc
      - name: Verify aggregates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest d1 execute analytics-db --remote -c analytics-worker/wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM agg_daily) AS daily_rows, (SELECT COUNT(*) FROM agg_weekly) AS weekly_rows, (SELECT COUNT(*) FROM agg_area_daily) AS area_rows, (SELECT COUNT(*) FROM agg_geo_daily) AS geo_rows"
