name: Page Test Gate — ALL sites

# Pre-deploy page test across the whole network (user rule, 22 Oct 2026).
# 25 Oct 2026 FIX (Claude audit): the old version fell back to testing ONLY the
# root when a site had no sitemap, then counted that as a PAGE FAIL — so every
# site without a sitemap (and every thin homepage) was reported failing even
# when all its real pages passed. Now: no sitemap = a separate "no-sitemap"
# bucket (a config issue, not a content fail); a site is only FAILING when it
# HAS a sitemap and a real page fails.

on:
  schedule:
    - cron: '40 2 * * *'   # daily 08:10 IST
  workflow_dispatch:
    inputs:
      per_site_limit:
        description: 'Max pages tested per site'
        required: false
        default: '12'
      min_words:
        description: 'Minimum words per page'
        required: false
        default: '120'

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test every site
        env:
          LIMIT: ${{ inputs.per_site_limit }}
          MINW: ${{ inputs.min_words }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          LIMIT=int(os.environ.get("LIMIT") or 12); MINW=int(os.environ.get("MINW") or 120)
          d=json.load(open("sites.json"))
          sites=[p.rstrip("/") for p in d.get("pages",[])]+[w["url"].rstrip("/") for w in d.get("workers",[])]
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 skm-test"}),timeout=20)
                  return r.getcode(), r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e: return e.code,""
              except Exception: return 0,""
          def test_page(html, code):
              title=re.search(r"<title>(.*?)</title>",html,re.S|re.I)
              h1=re.search(r"<h1[^>]*>",html,re.I)
              txt=re.sub(r"<script.*?</script>|<style.*?</style>","",html,flags=re.S|re.I)
              words=len(re.sub(r"<[^>]+>"," ",txt).split())
              probs=[]
              if code!=200: probs.append("HTTP %s"%code)
              if not title: probs.append("no title")
              if not h1: probs.append("no h1")
              if words<MINW: probs.append("thin %sw"%words)
              if "application/ld+json" not in html: probs.append("no JSON-LD")
              return probs
          site_fail={}; no_sitemap={}; total_pages=0; total_bad=0; passed=0
          for s in sites:
              c,b=get(s+"/sitemap.xml")
              urls=re.findall(r"<loc>([^<]+)</loc>", b) if c==200 else []
              has_sitemap=bool(urls)
              if not urls: urls=[s+"/"]
              urls=urls[:LIMIT]
              bad=[]
              for u in urls:
                  code,html=get(u); total_pages+=1
                  probs=test_page(html,code)
                  if probs: bad.append("%s [%s]"%(u,"; ".join(probs)))
              total_bad+=len(bad)
              if not has_sitemap:
                  no_sitemap[s]=bad; print("NO-SITEMAP | %s"%s)
              elif bad:
                  site_fail[s]=bad; print("FAIL %d/%d | %s"%(len(urls)-len(bad),len(urls),s))
              else:
                  passed+=1; print("PASS %d/%d | %s"%(len(urls),len(urls),s))
          print("\n===== NETWORK SUMMARY =====")
          print("Sites: %d | pages: %d | PASSING: %d | FAILING: %d | NO-SITEMAP: %d"%(len(sites),total_pages,passed,len(site_fail),len(no_sitemap)))
          if no_sitemap:
              print("\n--- NO SITEMAP (config, not content) ---")
              for s in no_sitemap: print("  - %s"%s)
          for s,bads in site_fail.items():
              print("\n%s:"%s)
              for x in bads[:6]: print("  - %s"%x)
          if site_fail: raise SystemExit(1)
          PY
