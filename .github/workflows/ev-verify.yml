name: EV Verify
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://evchargersnearme.pages.dev
          js=$(curl -s -m 30 "$B/_astro/app.jmDQV-_S.js")
          echo "carto_in_bundle=$(printf '%s' "$js" | grep -c cartocdn)"
          echo "esri_in_bundle=$(printf '%s' "$js" | grep -c arcgisonline)"
          echo "topo_in_bundle=$(printf '%s' "$js" | grep -c opentopomap)"
          echo "osm_in_bundle=$(printf '%s' "$js" | grep -c tile.openstreetmap.org)"
          echo "ccs2_redirect -> $(curl -s -o /dev/null -w '%{http_code}' -m 20 $B/ccs2/)"
